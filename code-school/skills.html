<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<link rel="alternate" hreflang="en" href="https://esmrsky.github.io/code-school/skills.html">
<link rel="alternate" hreflang="ru" href="https://esmrsky.github.io/code-school/ru/skills.html">
<link rel="alternate" hreflang="x-default" href="https://esmrsky.github.io/code-school/skills.html">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M32 13 5 26l27 13 27-13Z' fill='%2358a6ff'/%3E%3Cpath d='M18 33v11c0 4 6 7 14 7s14-3 14-7V33l-14 7Z' fill='%2358a6ff'/%3E%3C/svg%3E">
  <title data-ru="Карта навыков — Code School" data-ru-src="c0ed189161">Skills Map — Code School</title>

<style id="polish-pack">/* touch + type courtesies (estate pass Aug 2026; paragraphs Oct 15, 2026; every other text block Oct 30, 2026) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,a,button,summary,label,[role="button"]{-webkit-tap-highlight-color:transparent}
a,button,summary,[role="button"]{touch-action:manipulation}
@media (pointer:coarse){a:active,button:active,summary:active,[role="button"]:active{scale:.975}}
body{text-wrap-style:pretty}
h1,h2,h3{text-wrap:balance}
:where(h4,h5,h6,summary,legend,caption,dt,th,button){text-wrap-style:balance}
p,li,dd,figcaption{text-wrap:pretty}
</style>
</head>
<body data-page="skills">
<template id="lang-switch"><div class="lang-switch" role="group" aria-label="Language" data-ru-aria-label="Язык"><a class="lang-opt" href="/code-school/skills.html" data-ru-href="/code-school/skills.html" lang="en" hreflang="en" aria-current="page" data-ru-aria-current="false">EN</a><a class="lang-opt" href="/code-school/ru/skills.html" data-ru-href="/code-school/ru/skills.html" lang="ru" hreflang="ru" data-ru-aria-current="page">RU</a></div></template>

  <main class="wrap">
    <header class="page-head">
      <div class="kicker" data-ru="Основа этого сайта" data-ru-src="3a0ad6024c">The spine of this site</div>
      <h1 data-ru="Карта навыков" data-ru-src="7bc7aefc8e">The Skills Map</h1>
      <p class="lede" data-ru="Каждый час, который ты тратишь на учёбу, — инвестиция. В эпоху ИИ одни классические вложения теперь не окупаются вовсе, а другие окупаются больше, чем когда-либо. Три вердикта: <strong style=&quot;color: var(--green)&quot;>учить глубоко</strong>, <strong style=&quot;color: var(--yellow)&quot;>знать, что это</strong> или <strong style=&quot;color: var(--red)&quot;>спокойно пропустить</strong>." data-ru-src="ebfb7b64c9">
        Every hour you spend learning is an investment. In the AI era, some classic
        investments now pay nothing — and a few pay more than ever. Three verdicts:
        <strong style="color: var(--green)">learn deeply</strong>,
        <strong style="color: var(--yellow)">know of</strong>, or
        <strong style="color: var(--red)">safely skip</strong>.
      </p>
    </header>

    <div class="chips" id="filter-chips">
      <button class="chip on" data-filter="all" data-ru="Все" data-ru-src="a52ace420f">All</button>
      <button class="chip" data-filter="learn" data-ru="🟢 Учить глубоко" data-ru-src="4ac0f46d8f">🟢 Learn deeply</button>
      <button class="chip" data-filter="know" data-ru="🟡 Знать, что это" data-ru-src="97f559dfe6">🟡 Know of</button>
      <button class="chip" data-filter="skip" data-ru="🔴 Спокойно пропустить" data-ru-src="c21c511fd7">🔴 Safely skip</button>
    </div>

    <div id="skills-root"></div>
  </main>

  <script src="data/skills-data.js?v=2"></script>
  <script>
    const root = document.getElementById("skills-root");
    const IS_RU = document.documentElement.getAttribute("data-lang") === "ru";

    function esc(s) {
      return s ? s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }

    function render(filter) {
      root.innerHTML = "";
      const order = ["learn", "know", "skip"];
      order.forEach((verdict) => {
        if (filter !== "all" && filter !== verdict) return;
        const meta = SKILLS_META[verdict];
        const items = SKILLS.filter((s) => s.verdict === verdict);

        const section = document.createElement("section");
        section.className = "verdict-section";
        section.innerHTML = `
          <div class="verdict-head">
            <h2>${meta.title}</h2>
            <span class="badge ${meta.badge}">${meta.label}</span>
          </div>
          <p class="verdict-sub">${meta.sub}</p>
          <div class="grid grid-2">
            ${items
              .map(
                (s) => `
              <div class="card skill-card">
                <div class="skill-top">
                  <h3>${esc(s.name)}</h3>
                  <span class="badge badge-gray">${esc(s.tag)}</span>
                </div>
                <p class="why">${esc(s.why)}</p>
                ${
                  s.how
                    ? `<details class="deeper">
                        <summary>${IS_RU ? "Как этому учиться на практике" : "How to actually learn it"}</summary>
                        <div class="deeper-body">${esc(s.how)}</div>
                      </details>`
                    : ""
                }
              </div>`
              )
              .join("")}
          </div>`;
        root.append(section);
      });
    }

    document.getElementById("filter-chips").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#filter-chips .chip").forEach((c) => c.classList.remove("on"));
      btn.classList.add("on");
      render(btn.dataset.filter);
    });

    render("all");
  </script>
  <script src="js/main.js?v=2"></script>
<script src="/assets/ease-details.js" defer></script>
</body>
</html>
