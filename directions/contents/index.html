<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>esmrsky · Contents (direction 2)</title>
<meta name="description" content="Homepage direction 2: the estate set as the contents page of one book.">

<style>
  :root {
    color-scheme: light;
    --paper: #f3ede2;
    --ink: #221d17;
    --dim: #6a6052;
    --faint: #9a8f7f;
    --rule: rgba(34, 29, 23, .16);
    --rubric: #a3321f;
    --serif: "Literata", "Iowan Old Style", Georgia, serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #1a1612;
      --ink: #e9e0cf;
      --dim: #ab9f8c;
      --faint: #7d7364;
      --rule: rgba(233, 224, 207, .15);
      --rubric: #df7a5f;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 17px/1.6 var(--serif); font-optical-sizing: auto;
    font-variant-numeric: oldstyle-nums proportional-nums;
    -webkit-font-smoothing: antialiased; padding-bottom: 96px;
  }
  a { color: inherit; }
  .page { width: min(1080px, 100% - 32px); margin-inline: auto; }
  @media (min-width: 760px) { .page { width: min(1080px, 100% - 96px); } }

  /* Running head, as on a printed page. */
  .runhead { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--dim); }
  .runhead a { text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--ink); }
  .runhead span { font-style: italic; }

  /* Title page */
  .title { text-align: center; padding-block: clamp(72px, 14vh, 150px) clamp(64px, 11vh, 120px); }
  .title .name { font: 500 clamp(15px, 1.6vw, 18px)/1 var(--serif); letter-spacing: .5em; text-transform: uppercase; margin: 0 0 40px; padding-left: .5em; }
  .title h1 { font: 400 clamp(38px, 5.6vw, 76px)/1.06 var(--serif); letter-spacing: -.012em; margin: 0 auto 28px; max-width: 13em; }
  .title h1 i { color: var(--rubric); }
  .title .sub { font-style: italic; color: var(--dim); margin: 0; font-size: 18px; }
  .orn { display: block; width: 64px; height: 1px; background: var(--rubric); margin: 44px auto 0; border: 0; }

  .contents-h { text-align: center; font: 500 13px/1 var(--serif); letter-spacing: .42em; text-transform: uppercase; color: var(--rubric); margin: 0 0 56px; padding-left: .42em; }

  /* A part: its name hangs in the margin on wide screens. */
  .part { display: grid; gap: 10px 56px; padding-block: 36px 40px; border-top: 1px solid var(--rule); }
  @media (min-width: 900px) { .part { grid-template-columns: 220px minmax(0, 1fr); } }
  .part-label { margin: 0; }
  @media (min-width: 900px) { .part-label { position: sticky; top: 24px; align-self: start; } }
  .part-no { display: block; font: 500 12px/1 var(--serif); letter-spacing: .3em; text-transform: uppercase; color: var(--rubric); margin-bottom: 12px; }
  .part-name { display: block; font: italic 400 30px/1.12 var(--serif); }
  .part-note { display: block; font-weight: 400; font-size: 14.5px; line-height: 1.5; color: var(--dim); margin-top: 10px; max-width: 22em; }

  .toc { list-style: none; margin: 0; padding: 0; counter-reset: none; }
  .toc a {
    display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 0 14px;
    padding-block: 14px; text-decoration: none; min-height: 44px;
  }
  .num { font-size: 15px; color: var(--faint); text-align: right; padding-top: 4px; font-variant-numeric: oldstyle-nums tabular-nums; }
  .line { display: flex; align-items: baseline; gap: 10px; }
  .t { font: 500 21px/1.3 var(--serif); transition: color .25s var(--ease); text-wrap: balance; }
  .lead { flex: 1 1 24px; min-width: 24px; border-bottom: 1.5px dotted var(--faint); translate: 0 -5px; opacity: .7; transition: border-color .25s var(--ease); }
  .k { font-style: italic; font-size: 15px; color: var(--dim); white-space: nowrap; }
  .d { display: block; font-size: 15px; line-height: 1.55; color: var(--dim); margin: 4px 0 0; max-width: 40em; }
  .toc a:hover .t { color: var(--rubric); }
  .toc a:hover .lead { border-color: var(--rubric); }
  .toc a:focus-visible, .runhead a:focus-visible { outline: 2px solid var(--rubric); outline-offset: 3px; border-radius: 2px; }
  @media (max-width: 560px) {
    .line { flex-wrap: wrap; gap: 2px 10px; }
    .lead { display: none; }
    .k { flex-basis: 100%; order: -1; font-size: 13.5px; }
    .t { font-size: 20px; }
  }

  .colophon { border-top: 1px solid var(--rule); margin-top: 24px; padding-top: 28px; text-align: center; font-size: 14px; font-style: italic; color: var(--faint); }
  .colophon p { margin: 0 0 6px; }
</style>
<style id="polish-pack">/* touch + type courtesies (estate pass Aug 2026; paragraphs Oct 15, 2026; every other text block Oct 30, 2026) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,a,button,summary,label,[role="button"]{-webkit-tap-highlight-color:transparent}
a,button,summary,[role="button"]{touch-action:manipulation}
@media (pointer:coarse){a:active,button:active,summary:active,[role="button"]:active{scale:.975}}
body{text-wrap-style:pretty}
h1,h2,h3{text-wrap:balance}
:where(h4,h5,h6,summary,legend,caption,dt,th,button){text-wrap-style:balance}
p,li,dd,figcaption{text-wrap:pretty}
</style>
</head>
<body>
<div class="page">
  <header class="runhead">
    <a href="/">esmrsky</a>
    <span>Contents</span>
  </header>

  <section class="title">
    <p class="name">esmrsky</p>
    <h1>Collected <i>Studies</i></h1>
    <p class="sub" id="sub">In seven parts</p>
    <hr class="orn">
  </section>

  <main>
    <h2 class="contents-h">Contents</h2>
    <div id="parts"></div>
  </main>

  <footer class="colophon">
    <p>Each line opens one study. The first sentence beside it is the study’s own.</p>
    <p>Preview only. The live homepage is unchanged at <a href="/">esmrsky.github.io</a>.</p>
  </footer>
</div>

<script src="/directions/data.js"></script>
<script>
(function () {
  var D = window.ESMRSKY, by = {};
  D.sites.forEach(function (s) { by[s.slug] = s; });
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ORD = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight'];
  var WORDS = { 74: 'Seventy-four', 73: 'Seventy-three', 75: 'Seventy-five' };
  /* The first sentence only: a contents line is a promise, not the study. */
  var first = function (t) {
    var one = function (x) { var m = /^.+?[.?!](?=\s+[A-Z“"‘]|$)/.exec(x); return m ? m[0] : x; };
    /* A short opener ("God does not change.") needs the sentences after it to say what the study is. */
    var a = '', rest = t;
    while (rest && a.length < 70) { var b = one(rest); a = a ? a + ' ' + b : b; rest = rest.slice(b.length).trim(); }
    return a;
  };

  var n = 0, html = '';
  D.sections.forEach(function (sec, i) {
    var works = sec.s.map(function (k) { return by[k]; }).filter(Boolean);
    if (!works.length) return;
    html += '<section class="part" aria-labelledby="p-' + sec.id + '">' +
      '<h3 class="part-label" id="p-' + sec.id + '"><span class="part-no">Part ' + ORD[i] + '</span>' +
      '<span class="part-name">' + esc(sec.name) + '</span>' +
      '<span class="part-note">' + esc(sec.note) + '</span></h3><ol class="toc">' +
      works.map(function (s) {
        n++;
        return '<li><a href="' + s.href + '"><span class="num">' + n + '</span>' +
          '<span><span class="line"><span class="t">' + esc(s.title) + '</span><span class="lead" aria-hidden="true"></span><span class="k">' + esc(s.kind) + '</span></span>' +
          '<span class="d">' + esc(first(s.desc)) + '</span></span></a></li>';
      }).join('') + '</ol></section>';
  });
  document.getElementById('parts').innerHTML = html;
  document.getElementById('sub').textContent = 'on Scripture, the mind and the body, in ' + (WORDS[n] || n).toLowerCase() + ' studies and ' + ORD[D.sections.length - 1].toLowerCase() + ' parts';
})();
</script>
<script src="/directions/frame.js" defer></script>
</body>
</html>
