<main id="main">

      <button type="button" class="zoom" id="zoom" aria-pressed="false">Zoom in</button>
      <div class="timebar">

          <input type="range" id="time" min="0" max="1000" value="1000" step="1" aria-label="Light the window up to a year">
          <div class="tr-ends"><span>30</span><span>325</span><span>1054</span><span>1517</span><span>1700</span><span>1900</span><span>Today</span></div>
