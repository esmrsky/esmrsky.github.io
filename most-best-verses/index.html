<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121612">
    <title>The Most Best Verses</title>
  <meta name="description" content="Ninety-six favorite Scripture passages in a calm bento-card reader.">
  <script>
    try {
      const savedTheme = localStorage.getItem('promises96-theme');
      const preferredTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = ['dark', 'light'].includes(savedTheme) ? savedTheme : preferredTheme;
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" aria-label="Reader controls">
    <button class="mobile-settings-trigger" id="mobileSettingsTrigger" type="button" aria-label="Open reader settings" aria-controls="topControls" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"></path>
        <path d="M19.1 13.15a7.4 7.4 0 0 0 .05-1.15 7.4 7.4 0 0 0-.05-1.15l2-1.55-2-3.45-2.4.98a7.7 7.7 0 0 0-2-1.16L14.35 3h-4.1L9.9 5.67a7.7 7.7 0 0 0-2 1.16l-2.4-.98-2 3.45 2 1.55A7.4 7.4 0 0 0 5.45 12c0 .39.02.77.05 1.15l-2 1.55 2 3.45 2.4-.98a7.7 7.7 0 0 0 2 1.16l.35 2.67h4.1l.35-2.67a7.7 7.7 0 0 0 2-1.16l2.4.98 2-3.45-2-1.55Z"></path>
      </svg>
    </button>

    <div class="top-controls" id="topControls">
      <div class="theme-switch" aria-label="Color theme">
        <button class="theme-button" type="button" data-theme-option="dark" aria-label="Use dark theme" aria-pressed="true">
          <span aria-hidden="true">◐</span><span>Dark</span>
        </button>
        <button class="theme-button" type="button" data-theme-option="light" aria-label="Use light theme" aria-pressed="false">
          <span aria-hidden="true">☼</span><span>Light</span>
        </button>
      </div>

      <div class="version-picker" id="versionPicker">
        <button class="version-trigger" id="versionTrigger" type="button" aria-label="Choose Bible version" aria-haspopup="listbox" aria-expanded="false" aria-controls="versionMenu" aria-describedby="translationStatus">
          <strong id="selectedVersionLabel">NIV</strong>
          <span class="version-chevron" aria-hidden="true"><i>⌄</i></span>
        </button>
        <div class="version-menu" id="versionMenu" role="listbox" aria-label="Bible version" hidden>
          <button type="button" role="option" data-version-option="NIV"><span>NIV</span><small>New International Version</small><i aria-hidden="true">✓</i></button>
          <button type="button" role="option" data-version-option="TPT"><span>TPT</span><small>The Passion Translation</small><i aria-hidden="true">✓</i></button>
          <button type="button" role="option" data-version-option="NLT"><span>NLT</span><small>New Living Translation</small><i aria-hidden="true">✓</i></button>
          <button type="button" role="option" data-version-option="NASB"><span>NASB</span><small>New American Standard Bible</small><i aria-hidden="true">✓</i></button>
        </div>
      </div>
    </div>
  </header>

  <main id="collection">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow"><span>96</span> Scripture passages</p>
          <h1 id="page-title">The Most Best<br><em>Verses.</em></h1>
        <p class="lede">A quiet place to read the promises, truths, and declarations that steady a life.</p>
      </div>
      <div class="hero-index" aria-hidden="true">
        <span>Read</span>
        <strong>01—96</strong>
        <i></i>
        <small>Old + New Testament</small>
      </div>
    </section>

    <section class="filter-bar" aria-label="Filter passages by category">
      <div class="category-list" id="categoryFilters"></div>
      <p class="sr-only" id="translationStatus" aria-live="polite">Preparing NIV…</p>
      <span class="sr-only" id="visibleCount">96</span>
    </section>

    <section class="grid" id="cards" aria-label="96 Scripture passages"></section>
  </main>

  <footer>
    <span class="footer-mark" aria-hidden="true">✦</span>
    <p id="translationCredit">World English Bible (WEB). Public domain.</p>
    <a href="#collection">Back to top ↑</a>
    <button class="copy-visibility-button" id="copyVisibilityButton" type="button" aria-pressed="false">Show verse copy button</button>
  </footer>

  <script src="scripture-config.js"></script>
  <script src="scripture-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
