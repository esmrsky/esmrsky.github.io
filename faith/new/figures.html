        <li><span class="fig-st-name">Believed</span><span class="fig-st-ref">2 Corinthians 4:13</span></li>
        <li><span class="fig-st-name">Spoken again</span><span class="fig-st-ref">Proverbs 18:21</span></li>

      <figcaption class="fig-cap">Every hearer becomes a source. That is why an evil report spreads through two

        <li><span class="fig-st-name">Receive</span><span class="fig-st-ref">Mark 11:24</span></li>
