<title>Convergence Atlas · Calling-Discovery Instrument</title>

<script>
/* set theme before first paint — no flash of the wrong mode */

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..650;1,9..144,300..600&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.2,.7,.3,1)}

@property --bg{syntax:"<color>";inherits:true;initial-value:#0a0a0c}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#0f0f13}
@property --surface{syntax:"<color>";inherits:true;initial-value:#151519}
@property --surface2{syntax:"<color>";inherits:true;initial-value:#1c1c22}
@property --border{syntax:"<color>";inherits:true;initial-value:#28282f}
@property --border2{syntax:"<color>";inherits:true;initial-value:#37373f}
@property --text{syntax:"<color>";inherits:true;initial-value:#f1f1eb}
@property --muted{syntax:"<color>";inherits:true;initial-value:#abaeb6}
@property --dim{syntax:"<color>";inherits:true;initial-value:#71717b}
@property --ax4{syntax:"<color>";inherits:true;initial-value:#cf4634}
:root.theme-eases{transition:--bg .32s var(--ease),--bg2 .32s var(--ease),--surface .32s var(--ease),--surface2 .32s var(--ease),--border .32s var(--ease),--border2 .32s var(--ease),--text .32s var(--ease),--muted .32s var(--ease),--dim .32s var(--ease),--ax4 .32s var(--ease)}
@media (prefers-reduced-motion:reduce){:root.theme-eases{transition:none}}
:root{
  --serif:'Fraunces',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --maxw:46rem;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0c; --bg2:#0f0f13; --surface:#151519; --surface2:#1c1c22;
  --border:#28282f; --border2:#37373f;
  --text:#f1f1eb; --muted:#abaeb6; --dim:#71717b;
  --ax1:#e5677a; --ax2:#45b6a6; --ax3:#dda748; --ax4:#cf4634; --ax5:#96ac54; --ax6:#7fa0cf;
  --glowA:rgba(194,64,46,.07); --glowB:rgba(108,142,191,.06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f4ef; --bg2:#efece5; --surface:#ffffff; --surface2:#f4f1ea;
  --border:#e5e0d6; --border2:#d6cfc2;
  --text:#1b1a20; --muted:#565460; --dim:#8a867d;
  --ax1:#bb384f; --ax2:#1c8375; --ax3:#8f6212; --ax4:#b0331f; --ax5:#5a6f1f; --ax6:#3d5f97;
  --glowA:rgba(194,64,46,.05); --glowB:rgba(63,95,151,.05);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:435;line-height:1.66;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(52% 42% at 18% 8%, var(--glowA) 0%, transparent 70%),
             radial-gradient(46% 38% at 85% 90%, var(--glowB) 0%, transparent 70%)}
::selection{background:rgba(194,64,46,.30)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:450;letter-spacing:-.015em;line-height:1.14;margin:0 0 .6em}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 1.25rem}

/* ------- chrome ------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.6rem;
  padding:.3rem 1.25rem;background:color-mix(in srgb,var(--bg) 97%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.topbar .mark{position:relative;font-family:var(--serif);font-size:1.02rem;letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.topbar .mark b{font-weight:580}
.topbar nav{margin-left:auto;display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.topbar nav::-webkit-scrollbar{display:none}
.topbar nav a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-family:var(--mono);font-size:.66rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);text-decoration:none;padding:.45rem .5rem;border-radius:.5rem;white-space:nowrap}
.topbar nav a:hover{color:var(--text);background:var(--surface2)}
.topbar .mark::after{content:"";position:absolute;inset:-8px -4px}
.themebtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border:1px solid var(--border2);border-radius:.55rem;background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.themebtn:hover{color:var(--text);border-color:var(--dim)}
.themebtn svg{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none}
:root[data-theme="dark"] .themebtn .i-moon{display:none}
:root[data-theme="light"] .themebtn .i-sun{display:none}
/* inline icons */
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.eyebrow svg.ic{width:1.06em;height:1.06em;margin-right:.42em;vertical-align:-.17em}
.sechead .n svg.ic{width:1.15em;height:1.15em;margin-right:.45em;vertical-align:-.22em}
h2 svg.ic,h3 svg.ic{margin-right:.4em;vertical-align:-.06em}
svg.car{width:1.05em;height:1.05em;flex:none;color:var(--dim);transition:transform .2s var(--ease)}
@media(max-width:430px){
  .topbar{padding:.3rem .8rem;gap:.35rem}
  .topbar .mark{font-size:.9rem}
  .topbar nav{gap:0}
  .topbar nav a{font-size:.58rem;letter-spacing:.05em;padding:.4rem .32rem}
}

/* ------- typographic bits ------- */
.eyebrow{font-family:var(--mono);font-size:.68rem;font-weight:520;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin:0 0 1rem;display:flex;align-items:center}
.lede{font-size:1.09rem;font-weight:430;color:var(--muted)}
.serifq{font-family:var(--serif);font-style:italic;font-weight:400}
.ref{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--dim);letter-spacing:.02em}
.smallnote{font-size:.84rem;color:var(--muted)}
hr.rule{border:0;border-top:1px solid var(--border);margin:2.5rem 0}
.sechead{margin:5rem 0 1.6rem;padding-top:1.5rem}
.sechead h2{font-size:clamp(1.9rem,6vw,2.7rem)}
.sechead .n{font-family:var(--mono);color:var(--dim);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase}

/* ------- cards & badges ------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1.25rem 1.35rem}
.card+.card{margin-top:.8rem}
.badge{display:inline-flex;align-items:center;gap:.38em;font-family:var(--mono);font-size:.66rem;
  letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;border-radius:999px;border:1px solid var(--border2);color:var(--muted)}
.badge.strong{border-style:solid;border-color:color-mix(in srgb,var(--ac,#888) 65%,transparent);color:var(--text)}
.badge.partial{border-style:dashed;border-color:color-mix(in srgb,var(--ac,#888) 55%,transparent)}
.badge.none{border-style:dotted;color:var(--dim)}
.badge .dot{width:.5em;height:.5em;border-radius:50%;background:var(--ac,#888)}
.badge.partial .dot{background:linear-gradient(90deg,var(--ac,#888) 50%,transparent 50%)}
.badge.none .dot{background:transparent;border:1px solid var(--dim)}
.chip{display:inline-flex;align-items:center;gap:.45em;padding:.3rem .7rem;border-radius:999px;
  border:1px solid var(--border2);font-size:.8rem;color:var(--muted);background:var(--bg2)}
.chiprow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}

/* ------- buttons ------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;cursor:pointer;
  font-family:var(--sans);font-weight:560;font-size:.95rem;color:var(--text);
  background:var(--surface2);border:1px solid var(--border2);border-radius:.8rem;
  padding:.85rem 1.4rem;text-decoration:none;transition:transform .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
.btn:hover{border-color:var(--dim);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(160deg,#c2402e,#8f2d20);border-color:#d4553f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ax6);outline-offset:2px}

/* ------- hero ------- */
.hero{padding:4.5rem 0 1rem}
.hero .glyph{font-family:var(--serif);font-size:2.2rem;color:var(--dim);letter-spacing:.1em}
.hero h1{font-size:clamp(2.5rem,8.5vw,4.2rem);font-weight:380;margin:.4rem 0 1.2rem}
.hero h1 em{font-style:italic;font-weight:340}
.axisstrip{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.6rem 0}
.axisstrip .chip{position:relative;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-decoration:none}
.axisstrip .chip:hover{border-color:var(--dim);color:var(--text)}
.callout{border:1px solid var(--border);border-left:3px solid var(--ax3);border-radius:.8rem;
  padding:1.1rem 1.25rem;background:color-mix(in srgb,var(--surface) 70%,transparent);margin:2rem 0}
.callout .eyebrow{margin-bottom:.5rem}
.ctarow{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}

/* ------- inline quiz ------- */
#quizbox{border:1px solid var(--border2);border-radius:1.25rem;background:var(--surface);
  padding:1.6rem 1.5rem;min-height:20rem}
.qhead{display:flex;align-items:center;gap:1rem;margin:0 0 1rem}
.ring{width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--border)}
.ring .fgc{stroke:var(--axq,#c2402e);stroke-linecap:round;transition:stroke-dashoffset .32s var(--ease)}
.ring text{transform:rotate(90deg);transform-origin:center;font-family:var(--mono);font-size:11px;fill:var(--muted)}
.qpart{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.qtext{font-family:var(--serif);font-size:clamp(1.25rem,4.2vw,1.65rem);font-weight:400;line-height:1.3;margin:.7rem 0 1.6rem}
.opts{display:grid;gap:.6rem}
.opt{display:block;width:100%;text-align:left;cursor:pointer;background:var(--bg2);
  border:1px solid var(--border);border-radius:.9rem;padding:1rem 1.15rem;color:var(--text);
  font-size:.95rem;line-height:1.5;transition:border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
.opt:hover{border-color:var(--dim);background:var(--surface2)}
.opt:active{transform:scale(.99)}
.opt .k{font-family:var(--mono);font-size:.66rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:.15rem}
.opt.none{border-style:dashed;color:var(--muted)}
.likert{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:560px){.likert{grid-template-columns:repeat(4,1fr)}}
.likert .opt{text-align:center;font-weight:560;font-size:.9rem;padding:1rem .5rem}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem}
.linkbtn{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:.72rem;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:.5rem}
.linkbtn{min-height:44px}
.linkbtn:hover{color:var(--muted)}
.axisstrip .chip::after{content:"";position:absolute;inset:-8px -2px}
.footer .home{display:flex;align-items:center;width:fit-content;min-height:44px;margin-top:.6rem;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.footer .home:hover{color:var(--text)}

/* ------- result ------- */
.axchart{display:grid;gap:.65rem;margin:1.4rem 0}
.axrow{display:grid;grid-template-columns:minmax(7.5rem,auto) 1fr auto;gap:.8rem;align-items:center}
.axrow .nm{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.axrow .tr{display:block;height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);overflow:hidden}
.axrow .fl{display:block;height:100%;border-radius:99px;background:var(--ac);animation:grow 1.1s cubic-bezier(.22,1,.36,1) both;animation-delay:.25s}
@keyframes grow{from{width:0}}
.axrow .vl{font-family:var(--mono);font-size:.7rem;color:var(--dim);min-width:2.2em;text-align:right}
.bigcard{position:relative;border:1px solid color-mix(in srgb,var(--ac,#888) 40%,var(--border));
  background:linear-gradient(170deg,color-mix(in srgb,var(--ac,#888) 8%,var(--surface)),var(--surface) 55%);
  border-radius:1.25rem;padding:1.8rem 1.5rem;margin:1.2rem 0;overflow:hidden}
.bigcard .sym{font-size:2.8rem;line-height:1;filter:saturate(.85)}
.bigcard .tribe{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .2rem}
.bigcard h3,.bigcard h2{font-size:clamp(1.9rem,6.5vw,2.7rem);margin:0 0 .4rem}
.bigcard .axline{font-size:.92rem;color:var(--muted)}
.bigcard .axline b{color:var(--text);font-weight:560}
.reveal-stage{animation:fi .7s ease both;animation-delay:calc(.4s + var(--st,0)*.35s)}
.fadein{animation:fi .55s ease both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ------- atlas dossiers ------- */
.axsection{margin:4.5rem 0 0;border-top:1px solid var(--border);padding-top:2.5rem}
.axsection .axtitle{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.axsection .axtitle h3{font-size:clamp(1.7rem,5.5vw,2.3rem);margin:0;color:var(--ac)}
.axsection .axtitle .ref{letter-spacing:.2em;text-transform:uppercase}
.poleintro{display:grid;gap:.8rem;margin:1.4rem 0}
@media(min-width:640px){.poleintro{grid-template-columns:1fr 1fr}}
.pole{border:1px solid var(--border);border-radius:.9rem;padding:1.05rem 1.15rem;background:var(--bg2)}
.pole .t{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.4rem}
.pole.core .t{color:var(--ac)} .pole.inv .t{color:var(--muted)}
.pole .nm{font-family:var(--serif);font-size:1.22rem;font-weight:480;margin-bottom:.3rem}
.pole p{margin:.2rem 0 0;font-size:.9rem;color:var(--muted)}
.altarpair{display:grid;gap:.8rem;margin:.8rem 0}
@media(min-width:640px){.altarpair{grid-template-columns:1fr 1fr}}
.principleline{font-family:var(--serif);font-style:italic;font-weight:380;font-size:1.05rem;color:var(--text);margin:1rem 0}

.dossier{margin:1rem 0;border:1px solid color-mix(in srgb,var(--ac) 30%,var(--border));border-radius:1.25rem;overflow:hidden;scroll-margin-top:4.5rem;background:var(--surface)}
.dossier.you{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 55%,transparent), 0 0 46px color-mix(in srgb,var(--ac) 14%,transparent)}
.dossier>summary.dhead{cursor:pointer;list-style:none;padding:1.3rem 1.4rem 1.15rem;
  background:linear-gradient(170deg,color-mix(in srgb,var(--ac) 10%,var(--surface)),var(--surface) 62%);
  transition:background .2s var(--ease)}
.dossier>summary.dhead::-webkit-details-marker{display:none}
.dossier>summary.dhead::marker{content:""}
.dossier:not([open])>summary.dhead:hover{background:linear-gradient(170deg,color-mix(in srgb,var(--ac) 16%,var(--surface)),var(--surface) 62%)}
.dhead .row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.dhead .sym{font-size:2.4rem;line-height:1}
.dhead h4{font-size:clamp(1.5rem,5vw,2.05rem);margin:0}
.dhead .tr{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dhead .axline{font-size:.92rem;color:var(--muted);margin:.7rem 0 0}
.dhead .axline b{color:var(--text);font-weight:560}
.dhead .expand{display:flex;align-items:center;justify-content:flex-end;gap:.35rem;margin-top:.85rem;
  font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.dossier[open] .dhead .expand .car{transform:rotate(90deg)}
.dossier:not([open]) .ex-close{display:none}
.dossier[open] .ex-open{display:none}
.youtag{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);border:1px dashed color-mix(in srgb,var(--ac) 60%,transparent);border-radius:999px;padding:.25rem .7rem}
.dbody{padding:1.2rem 1.4rem 1.6rem;display:grid;gap:1.4rem}
.dsec>.eyebrow{margin-bottom:.6rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.9rem}
.kv dt{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding-top:.22em}
.kv dd{margin:0;color:var(--muted)}
.kv dd b{color:var(--text);font-weight:560}
ul.clean{list-style:none;margin:.6rem 0;padding:0;display:grid;gap:.5rem}
ul.clean li{padding:.65rem .9rem;background:var(--bg2);border:1px solid var(--border);border-radius:.65rem;font-size:.9rem;color:var(--muted)}
ul.clean.everyday li{border-left:3px solid color-mix(in srgb,var(--ac) 65%,transparent)}
details.acc{border:1px solid var(--border);border-radius:.9rem;background:var(--bg2);overflow:hidden}
details.acc summary{cursor:pointer;list-style:none;padding:.95rem 1.1rem;display:flex;align-items:center;gap:.7rem;font-weight:560;font-size:.93rem}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .car{margin-left:auto;color:var(--dim);transition:transform .2s var(--ease)}
details.acc[open] summary .car{transform:rotate(90deg)}
details.acc .inner{padding:0 1.1rem 1.1rem;border-top:1px solid var(--border)}
.arc{position:relative;margin:1rem 0 .4rem;padding-left:2.05rem}
.arc::before{content:"";position:absolute;left:.635rem;top:.8rem;bottom:.8rem;width:1.5px;background:linear-gradient(var(--ac),var(--border))}
.arc .step{position:relative;padding:.1rem 0 1.15rem}
.arc .step::before{content:attr(data-n);position:absolute;left:-2.05rem;top:.24rem;width:1.4rem;height:1.4rem;border-radius:50%;
  background:var(--bg);border:1px solid color-mix(in srgb,var(--ac) 70%,var(--border));
  color:var(--ac);font-family:var(--mono);font-size:.66rem;font-weight:600;display:grid;place-items:center;line-height:1}
.arc .st{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.18em;color:var(--ac);margin-bottom:.2rem}
.arc p{margin:.1rem 0 0;font-size:.9rem;color:var(--muted)}
.vaultrow{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.vaultrow:last-child{border-bottom:0}
.vaultrow .lb{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);padding-top:.35em;white-space:nowrap}
.vaultrow .tx{font-size:.88rem;color:var(--muted)}
.vaultrow .tx .serifq{color:var(--text)}
.quote{border-left:2px solid var(--ac,#888);padding:.2rem 0 .2rem 1rem;margin:.9rem 0;font-family:var(--serif);font-style:italic;font-weight:380;font-size:1rem;color:var(--text)}
.proven{font-family:var(--mono);font-size:.62rem;color:var(--dim);letter-spacing:.05em;margin-top:.5rem}

/* case study cards (collapsible) */
.cases{display:grid;gap:.65rem}
.case{border:1px solid var(--border);border-radius:.9rem;background:var(--bg2);overflow:hidden}
.case.featured{border-color:color-mix(in srgb,var(--ac) 55%,var(--border));background:linear-gradient(170deg,color-mix(in srgb,var(--ac) 7%,var(--bg2)),var(--bg2) 60%)}
.case>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;padding:.85rem 1.05rem}
.case>summary::-webkit-details-marker{display:none}
.case>summary::marker{content:""}
.case>summary .nm{font-family:var(--serif);font-size:1.12rem;font-weight:500}

/* ---------- wide canvas outside, reading measure inside ---------- */
:root{--wide:var(--maxw);--gut:1.25rem}

/* ---------- five sections, five identities ---------- */
main>section{position:relative;padding:4rem 0 4.5rem;--ac:var(--sec)}

#atlas{--sec:var(--ax6)}
#table{--sec:var(--ax2)}
#compendium{--sec:var(--ax3)}
#method{--sec:var(--ax5)}
.hero{padding:3.5rem 0 4rem}

main>section::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;
  width:100vw;transform:translateX(-50%);pointer-events:none}
#diagnostic::before,#table::before,#method::before{
  background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 8%,var(--bg2)) 0%,var(--bg2) 34%);

details.acc{border-left:3px solid color-mix(in srgb,var(--ac,var(--border2)) 55%,var(--border))}

  font-weight:520;letter-spacing:.13em;text-transform:uppercase;padding:.22rem .58rem;
  border-radius:999px;white-space:nowrap;
  color:color-mix(in srgb,var(--ac,var(--dim)) 70%,var(--text));

const CANON = {"meta":{"built":"2026-07-10","sourceHashes":{"Atlas-V8-Red-v9-Enhanced.html":"4823cd241dc40481","Convergence-02 copy.html":"cddfa9fe185e1c7b","atlas-archive.html":"38c406f2b55ffa5a","convergence-atlas.html":"8074086b9176c906"}},"framing":{"thesis":"The enemy attacks at the inverse of your calling. If you can name the pattern that keeps hitting you, you can reverse-engineer what you were built for—though most people run composites across multiple axes.","intro":"Twelve archetypal patterns, mapped across six pairs of core and inverse frequencies. Each pair holds a calling at one pole and a characteristic attack at the other—the shape of the temptation that turns the gift against itself.","guardrail":"These are archetypal patterns — diagnostic lenses, not destinies. Most people run multiple archetypes at once and cycle through them across seasons. The New Testament dissolves tribal identity in Christ (Galatians 3:28); what persists are the psychological and vocational patterns the tribal stories illuminate. Nothing here is diagnostic of your lineage. Everything here is diagnostic of your wiring. The purpose of recognition is repentance, not self-labeling.","oneLens":"The calling-through-corruption pattern shows up in multiple serious frameworks, and none of the numbers are canonical. Dan Allender & Cathy Loerzel map three wound archetypes (orphan, stranger, widow) to three callings (priest, prophet, king/queen). Tim Keller names four deep idols (power, approval, comfort, control) beneath all surface idolatry. Arthur Burk teaches seven redemptive gifts from Romans 12. Taylor Welch works with twelve tribal archetypes. This atlas synthesizes the twelve onto six frequency axes — a specific choice, not a final word. If this lens doesn't fit you, another one might. The thesis all of them share — that your shape of suffering often reveals your shape of calling — is what's worth holding.","kellerQuestions":["What do you characteristically daydream about?","What could you lose that would make life feel not worth living?","What fills you with irrational anger, anxiety, despondency, or guilt?"],"kellerNote":"Adapted from Timothy Keller's diagnostic method in Counterfeit Gods. The answers tend to point to what you are actually worshiping — which, per this atlas, is usually the inverse of what you were built for.","surrender":"There is a much easier way to all of this: simple, child-like surrender to Jesus. You do not need to memorize these frameworks to be free. However, if you are stuck in a loop, if you want to pop the hood and understand exactly how the machinery of your soul operates, where it breaks down, and how it is targeted by the enemy... take a look."},"axes":[{"id":1,"name":"Love ⇌ Rejection","icon":"ph-heart","accent":{"key":"love","hex":"#e05a6d"},"core":{"name":"Love","desc":"Beloved before output. Presence is sufficient. (1 John 4:18)"},"inverse":{"name":"Rejection","desc":"Worth fluctuates with the room. Approval is continually audited. (Prov 29:25)"},"principle":"The calling on this axis is to create spaces of belonging. The attack is the certainty that you must earn every seat you are given.","altars":{"counterfeit":{"name":"Acceptance","desc":"Idolizing validation. People-pleasing and performance to avoid the old rejection wound."},"godly":{"name":"Worship","desc":"Receiving identity from God before the room can confer it."}},"essay":{"coreText":"Beloved before output. Presence is sufficient. Worth does not fluctuate with the room. Mark 1:11: the voice speaks \"You are my beloved\" before any miracle has been performed.","inverseText":"Worth fluctuates with the room. Every interaction is quietly audited for signs of approval. Absence is read as punishment. The nervous system spikes at \"can we talk?\"","counterfeitAltar":{"name":"The Altar of Acceptance","desc":"Idolizing the validation of others; performing, people-pleasing, and striving to be seen-as-good to avoid the old rejection wound."},"godlyAltar":{"name":"The Altar of Worship","desc":"Receiving identity from God before the room can confer it. Complete acceptance in Him rather than human approval."}},"archetypes":[{"tribe":"Asher","name":"The Host","symbol":"🍞","scripture":"\"Out of Asher his bread shall be fat, and he shall yield royal dainties.\" - Gen 49:20","altars":{"counterfeit":"Acceptance","godly":"Worship"},"positiveTraits":["Empathetic","Nurturing","Peacemaker","Hospitality"],"shortStruggles":["People-Pleasing","Gluttony","Numbing"],"shortPassions":["Hospitality","Atmosphere","Nourishing"],"biblicalExamples":["Martha of Bethany","Abigail","Philemon","Barnabas","Lydia","Obadiah","Mary of Bethany"],"struggles":["Chronic people-pleasing resulting in hidden, deep-seated burnout.","Using food, scrolling, or distraction to numb social discomfort.","Feeling over-responsible for everyone else's emotional state.","Avoiding necessary conflict, allowing toxicity to grow unaddressed.","Panicking when someone in the room is visibly upset with them.","Chronically over-apologizing for things that aren't your fault.","Staying in one-sided or draining relationships simply to avoid the pain of abandonment."],"lubricant":"A nourishing atmosphere the host is actively building for others, not passively requiring as input.","warfare":{"name":"Rejection / Comfort","mechanic":"Weaponizes harmony by demanding the sacrifice of truth to maintain artificial peace."},"synthesis":{"burkGift":"Servant","traumaType":"Orphan (Loss of Faith)","kellerIdol":"Approval & Comfort","spirit":"Rejection/Comfort","lie":"\"Scarcity means I must self-comfort or please people.\"","redemptiveArc":"<strong>Priest Arc:</strong> Establish firm emotional boundaries; find identity and worth solely in God's presence; dismantle the Altar of Acceptance to become a true host of the Spirit."},"symptomCluster":{"burnout":"Empathy Burnout: Severe exhaustion from metabolizing and managing the emotional weather of the entire organization.","isolation":"Retreating into absolute silence and scrolling to avoid processing any more external needs or complaints.","primaryShadow":"Validation-Seeking: Consuming connection, praise, and artificial pleasantness to fill a deep approval void. (Gal 1:10)","godlyExpression":"Pure Worship & Hospitality: Cultivating an atmosphere of grace without needing validation."},"neuroMechanics":{"emotionalSignature":"Overwhelming anxiety disguised as 'caring'; a deep, visceral panic of abandonment if the room isn't happy.","traumaEcho":"Triggers the Orphan wound of feeling inherently unsafe unless actively earning a place through service and pacification.","counterfeitReward":"The artificial, temporary peace of a conflict-free room.","somaticTripwire":"Tightness in the throat; a sudden, overwhelming urge to appease or apologize when someone frowns.","ecosystemCollision":"Friction with Simeon (The Blade), whose blunt truth-telling shatters Asher's carefully curated artificial peace.","firstFiveMinutes":"Leave the room immediately. Drink cold water. Do not fix the person's mood. Let them be upset."},"longTermProtocol":{"mindsetShift":"Realizing that 'artificial peace' is actually a form of control and cowardice, not genuine love.","structuralBoundary":"Committing to 'Letting the awkward silence hang'—refusing to fill conversational voids with apologies or food.","altarReplacement":"Dismantling the Altar of Acceptance (managing others' emotions) to build the Altar of Pure Worship (enjoying God's presence without producing anything for anyone)."},"caseStudies":[{"title":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"journey":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room. Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","healing":"Jesus explicitly naming the somatic root: 'Martha, you are anxious and troubled about many things.' Dismantling the altar of acceptance and choosing the 'good portion'—presence over pleasantness."},{"title":"Abigail's Intercession","verse":"1 Samuel 25:23","callings":["Peacemaker","Intercessor"],"goodTraits":["Discerning","Humble","Quick-acting"],"badTraits":["Married to a fool","Absorbing Wrath"],"journey":"Intercepting David's uncommissioned wrath caused by her husband's intense foolishness. Willingly taking the blame upon herself to absorb the conflict and save her household.","healing":"David blesses her discernment and halts the bloodshed. God handles Nabal directly, and she is elevated from a house of foolishness into the King's palace."},{"title":"Mary of Bethany","verse":"John 12:3","callings":["Worshiper","Devoted Follower"],"goodTraits":["Extravagant","Present","Focused"],"badTraits":["Misunderstood","Judged by peers"],"journey":"Breaking the alabaster flask, wasting a year's wages on pure presence. Completely ignoring the social calculus and the financial critiques of the men in the room.","healing":"Jesus immortalizes her action, fiercely defending her against Judas's 'practicality', validating that pure worship is infinitely more valuable than artificial utility."}],"react":{"fear":"Scarcity — not of money, but of ease, comfort, pleasantness in the room.","coreDesc":"Wired to read the room and nourish it. Notices what people need before they ask. Pastors through atmosphere rather than announcement.","inverseDesc":"Conflict-avoidance disguised as peacekeeping. Reflex reach for screen, snack, or scroll at the first whisper of discomfort.","warfareMechanic":"Weaponizes the desire for harmony by demanding the sacrifice of truth to maintain artificial peace. Forces the host to serve the room instead of God.","caseStudies":[{"name":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"fracture":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room.","counterfeitLoop":"Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","divineInterruption":"Jesus naming the somatic root: 'Martha, you are anxious and troubled about many things.'","redemptivePivot":"Dismantling the altar of acceptance and choosing the 'good portion' — presence over pleasantness.","struggle":"Tried to earn her right to the room by performing perfectly; her rejection wound triggered resentment toward Mary.","healing":"Jesus invited her to the Altar of Worship — she was already beloved without performing."},{"name":"King Saul","verse":"1 Samuel 15:24","callings":["King"],"goodTraits":["Capable","Initially humble"],"badTraits":["People-fearing","Disobedient","Rationalizing"],"fracture":"Fearing the people more than he feared God during the battle with the Amalekites.","counterfeitLoop":"Keeping the spoils to appease his soldiers, dressing up disobedience as 'sacrifice'.","divineInterruption":"Samuel stating clearly that 'rebellion is as the sin of witchcraft'.","redemptivePivot":"Failure to pivot; Saul loses the kingdom because he chose Acceptance over obedience.","struggle":"Chose the approval of the army over the voice of God.","healing":"Missed. The kingdom was torn from him."}]},"essay":{"emoji":"🫒","epithet":"The Host","callingPole":"Wired to read the room and nourish it. Notices what people need before they ask. Pastors through atmosphere rather than announcement. Makes every space feel like home.","attackPole":"Conflict-avoidance disguised as peacekeeping. Reflex reach for screen, snack, or scroll at the first whisper of discomfort. Scarcity panics escalate even as life objectively grows more abundant.","lubricant":"A nourishing atmosphere the host is actively building for others, not passively requiring as input.","coreFear":"Scarcity — not of money, but of ease, comfort, pleasantness in the room.","scriptureAnchor":"\"Out of Asher his bread will be rich, and he will yield royal dainties.\" (Gen 49:20)","secondaryResonance":"Benjamin (primary: Dominion) carries a loyalty-trigger that activates on this axis — perceived disloyalty reads as rejection, and the wolf responds. Naphtali (primary: Joy) does its deepest healing work on this axis — freedom after rejection is the gift it brings others."},"vault":{"examples":["The team lead who reads everyone's Slack tone before they speak — and quietly carries the room's anxiety home each night.","The mom who cancels her own plans the moment a kid sighs at dinner.","The pastor who softens every hard sermon point to keep the room comfortable, then resents the elders for not seeing the cost.","The friend who scrolls until 2 a.m. after one tense conversation, unable to put the phone down.","The host who over-orders food for every gathering because 'what if it isn't enough'."],"scriptureVault":[{"label":"Covenant","ref":"Genesis 49:20","text":"Asher's food will be rich; he will provide delicacies fit for a king."},{"label":"Calling","ref":"Deuteronomy 33:24-25","text":"Most blessed of sons is Asher; let him be favored by his brothers, and let him bathe his feet in oil."},{"label":"Fall","ref":"1 Samuel 15:24","text":"I have sinned. I violated the Lord's command and your instructions. I was afraid of the men and so I gave in to them."},{"label":"Prophetic","ref":"Isaiah 26:3","text":"You will keep in perfect peace those whose minds are steadfast, because they trust in you."},{"label":"NT Echo","ref":"Luke 10:41-42","text":"Martha, Martha, you are worried and upset about many things, but few things are needed — or indeed only one."},{"label":"Redemption","ref":"John 4:23-24","text":"Yet a time is coming and has now come when the true worshipers will worship the Father in the Spirit and in truth."},{"label":"Identity","ref":"1 John 4:18","text":"There is no fear in love. But perfect love drives out fear, because fear has to do with punishment."}]},"bloodline":{"id":"bl-asher","slug":"asher","category":"bloodline","title":"Asher","domain":"Blessing / Provision","tribe":"Asher","tagline":"The royal table-keeper called to feed kings without becoming one.","trueCalling":{"essence":"Asher means 'happy / blessed.' His calling is rich provision that feeds others — oil, wine, royal dainties. Sanctified Asher is the steward of abundance whose feet are dipped in oil and whose table is open.","mandate":"To produce and steward abundance for the kings of God's house, to feed without flattering, to keep the table set and the lamp oiled.","scripture":[{"ref":"Genesis 49:20","text":"Asher's food shall be rich, and he shall yield royal delicacies."},{"ref":"Deuteronomy 33:24-25","text":"Let him dip his foot in oil. Your bars shall be iron and bronze."},{"ref":"Luke 2:36","text":"Anna, of the tribe of Asher — the prophetess who fasted at the temple."}]},"gifting":{"primary":["Provision","Hospitality","Abundance stewardship"],"operational":["Marketplace creation","Hosting","Patronage of ministry","Resource generation"]},"shadow":{"idol":"Mammon — provision as identity and shield","altarName":"Mammon","lieQuote":"If I provide enough, I am safe. My generosity is my righteousness. The kings need my table; without me they go hungry.","diagnostics":["Do you give from fear of being replaced?","Do you secretly weigh others by what they cost or contribute?","Has your hospitality become a soft form of control?","Do you feel useful only when feeding others?"],"lubricant":"The warm thanks at the table. The sense of indispensable usefulness. Wealth that feels like worship because it serves the work.","legalAccess":"Provision sourced from striving rather than from the Lord's blessing. Mammon gains jurisdiction wherever giving becomes leverage.","fruitInLife":["Anxiety about scarcity in the middle of plenty","Resentful patrons and entitled recipients","Identity tied to net worth or productivity","An inability to receive without immediately reciprocating"]},"countermove":{"name":"Oiled Foot","remedyHeadline":"Royal dainties belong on the table of the brothers — not hoarded in the cellar.","description":"Asher is restored when his abundance flows from blessing rather than striving — when the table is the Lord's, when the giver receives, and when fasting is as familiar as feasting (cf. Anna).","repentancePattern":["Confess the giving done to secure standing","Renounce Mammon as protector","Receive a gift you cannot repay","Fast as Anna fasted, until the table is His again"],"ancientCase":"Anna of the tribe of Asher (Luke 2) — the Asher calling fulfilled in fasting and prophetic recognition of the Christ. The royal delicacies became the willingness to be hungry until the King appeared.","modernTranslation":"The patron whose ministry-giving is also leverage. The hostess whose home is open and whose heart is closed. The marketplace believer who tithes generously and trusts the bank account more than the Lord.","decree":"The Lord is my provision and my portion. My table is His. I receive without reciprocating, and I fast until His face appears."},"frequencies":{"core":{"name":"Abundance from Blessing","signature":"Open hands and an unhurried table; provision that comes without striving."},"inverse":{"name":"Mammon Anxiety","signature":"Tight chest at scarcity; giving as transaction; gratitude as performance."}},"related":{"callings":["king","marketplace"],"altars":["mammon"],"frequencies":["scarcity-provision"]}},"axisId":1,"axisName":"Love ⇌ Rejection","blueprint":{"figure":"Martha of Bethany","reactCase":"Martha of Bethany","v8Case":"Martha of Bethany","lineage":{"label":"wiring-match","note":"Lineage not stated; Bethany of Judea. The atlas reads wiring, not lineage."},"wiring":["Luke 10:38–42"],"redemption":["Luke 10:41–42","John 12:2"],"why":"The only Asher case with both poles on the page: the anxious host named by Jesus at the somatic root, later serving again at a table — at peace — in John 12:2.","arc":{"name":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"fracture":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room.","counterfeitLoop":"Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","divineInterruption":"Jesus naming the somatic root: 'Martha, you are anxious and troubled about many things.'","redemptivePivot":"Dismantling the altar of acceptance and choosing the 'good portion' — presence over pleasantness.","struggle":"Tried to earn her right to the room by performing perfectly; her rejection wound triggered resentment toward Mary.","healing":"Jesus invited her to the Altar of Worship — she was already beloved without performing."},"v8Arc":{"title":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"journey":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room. Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","healing":"Jesus explicitly naming the somatic root: 'Martha, you are anxious and troubled about many things.' Dismantling the altar of acceptance and choosing the 'good portion'—presence over pleasantness."}},"allCases":[{"title":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"journey":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room. Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","healing":"Jesus explicitly naming the somatic root: 'Martha, you are anxious and troubled about many things.' Dismantling the altar of acceptance and choosing the 'good portion'—presence over pleasantness.","arc":{"name":"Martha of Bethany","verse":"Luke 10:41","callings":["The Host","Servant Leader"],"goodTraits":["Hospitality","Diligence","Service"],"badTraits":["Performance Anxiety","Resentment","Control"],"fracture":"Taking on massive, uncommissioned hosting duties to earn love and secure her place in the room.","counterfeitLoop":"Frantically serving while building deep resentment toward Mary for not participating in the anxiety.","divineInterruption":"Jesus naming the somatic root: 'Martha, you are anxious and troubled about many things.'","redemptivePivot":"Dismantling the altar of acceptance and choosing the 'good portion' — presence over pleasantness.","struggle":"Tried to earn her right to the room by performing perfectly; her rejection wound triggered resentment toward Mary.","healing":"Jesus invited her to the Altar of Worship — she was already beloved without performing."},"isBlueprint":true},{"title":"Abigail's Intercession","verse":"1 Samuel 25:23","callings":["Peacemaker","Intercessor"],"goodTraits":["Discerning","Humble","Quick-acting"],"badTraits":["Married to a fool","Absorbing Wrath"],"journey":"Intercepting David's uncommissioned wrath caused by her husband's intense foolishness. Willingly taking the blame upon herself to absorb the conflict and save her household.","healing":"David blesses her discernment and halts the bloodshed. God handles Nabal directly, and she is elevated from a house of foolishness into the King's palace.","isBlueprint":false},{"title":"Mary of Bethany","verse":"John 12:3","callings":["Worshiper","Devoted Follower"],"goodTraits":["Extravagant","Present","Focused"],"badTraits":["Misunderstood","Judged by peers"],"journey":"Breaking the alabaster flask, wasting a year's wages on pure presence. Completely ignoring the social calculus and the financial critiques of the men in the room.","healing":"Jesus immortalizes her action, fiercely defending her against Judas's 'practicality', validating that pure worship is infinitely more valuable than artificial utility.","isBlueprint":false},{"title":"King Saul","verse":"1 Samuel 15:24","callings":["King"],"goodTraits":["Capable","Initially humble"],"badTraits":["People-fearing","Disobedient","Rationalizing"],"arc":{"name":"King Saul","verse":"1 Samuel 15:24","callings":["King"],"goodTraits":["Capable","Initially humble"],"badTraits":["People-fearing","Disobedient","Rationalizing"],"fracture":"Fearing the people more than he feared God during the battle with the Amalekites.","counterfeitLoop":"Keeping the spoils to appease his soldiers, dressing up disobedience as 'sacrifice'.","divineInterruption":"Samuel stating clearly that 'rebellion is as the sin of witchcraft'.","redemptivePivot":"Failure to pivot; Saul loses the kingdom because he chose Acceptance over obedience.","struggle":"Chose the approval of the army over the voice of God.","healing":"Missed. The kingdom was torn from him."},"reactOnly":true,"isBlueprint":false}],"fivefold":[{"office":"Shepherd (Pastor)","confidence":"partial","basis":"Inference: pastoral atmosphere (“Pastors through atmosphere rather than announcement” — essay). Archive links Asher to Marketplace Minister, a non-fivefold calling."}],"fivefoldNone":null,"secular":{"label":"The Host","pearson":"Caregiver","gloss":"the one who makes rooms feel safe"},"axisConfidence":"strong"}]},{"id":2,"name":"Peace ⇌ Anxiety","icon":"ph-shield","accent":{"key":"peace","hex":"#3fae9f"},"core":{"name":"Peace (Shalom)","desc":"Trust in covenant. Rest is received, not earned. (Isaiah 26:3)"},"inverse":{"name":"Anxiety","desc":"Threat-filter running hot. Paralyzing worry unless controlling outcomes. (Phil 4:6)"},"principle":"The calling on this axis is to hold steady where others cannot. The attack is the conviction that your nervous system is the last line of defense.","altars":{"counterfeit":{"name":"Control","desc":"Idolizing self-management and outcome-engineering. Manipulating reality outside of submission."},"godly":{"name":"Protection","desc":"Releasing the weight of the world to the One who already carries it."}},"essay":{"coreText":"Wholeness. Trust in covenant. The world is safe because it is held. Rest is not earned — it is received. Sabbath is not theft.","inverseText":"Paralyzing worry. Threat-filter running hot. The belief that the world is unsafe unless you personally manage every variable. Rest feels like stealing.","counterfeitAltar":{"name":"The Altar of Control","desc":"Idolizing self-management and outcome-engineering. Attempting to manipulate reality outside of submission, because submission feels like exposure."},"godlyAltar":{"name":"The Altar of Protection","desc":"Releasing the weight of the world to the One who already carries it. Trusting that God is the ultimate protector and guarantor of outcomes."}},"archetypes":[{"tribe":"Gad","name":"The Raider","symbol":"⚔️","scripture":"\"Gad, a troop shall overcome him: but he shall overcome at the last.\" - Gen 49:19","altars":{"counterfeit":"Control","godly":"Protection"},"positiveTraits":["Perseverant","Protective","Strategic","Enduring"],"shortStruggles":["Workaholism","Burnout","Control"],"shortPassions":["Endurance","Rebuilding","Protection"],"biblicalExamples":["Elijah","Moses","Nehemiah","Joshua","Caleb","David (in battle)","Jephthah"],"struggles":["Refusing to delegate tasks, then resenting others for not helping.","Sabbath and rest days feel unproductive, anxiety-inducing, or guilt-ridden.","Subconsciously creating or extending emergencies just to feel useful and vital.","Severe physiological burnout masked as \"perseverance\".","Inability to sleep because you are mentally solving tomorrow's problems.","Physical manifestations of stress (migraines, stomach issues) that you ignore to keep pushing."],"lubricant":"Rhythmic, non-negotiable Sabbath built into the fight.","warfare":{"name":"Leviathan / Control","mechanic":"Induces a false sense of responsibility, crushing the victim under outcomes they were never meant to carry."},"synthesis":{"burkGift":"Ruler","traumaType":"Orphan (Betrayal)","kellerIdol":"Control","spirit":"Leviathan/Control","lie":"\"Rest equals collapse and letting people down.\"","redemptiveArc":"<strong>King/Queen Arc:</strong> Lead from a posture of rest; learn to empower and delegate to others rather than carrying the entire burden; intentionally dismantle the Altar of Control."},"symptomCluster":{"burnout":"Adrenaline Burnout: Physiological collapse from sustaining a state of absolute hyper-vigilance and solo execution.","isolation":"Martyr-driven Isolation: Secretly believing no one else is competent, thus creating an impenetrable silo of work.","primaryShadow":"Control: An insatiable appetite for micro-managing outcomes to guarantee systemic safety. (James 4:13-15)","godlyExpression":"Covenant Protection: Enduring for the mission without hoarding control or resenting others."},"neuroMechanics":{"emotionalSignature":"A simmering, low-grade rage that no one else is working as hard or cares as much, masking profound exhaustion.","traumaEcho":"The Orphan wound of betrayal—subconsciously believing 'If I don't hold the walls up, everyone will die and no one will help me.'","counterfeitReward":"The intoxicating 'moral high ground' of being the only one bleeding for the mission.","somaticTripwire":"Jaw clenching; shallow chest breathing; racing thoughts during designated rest periods.","ecosystemCollision":"Friction with Issachar (The Sage), viewing their slow analysis as cowardly inaction during a crisis.","firstFiveMinutes":"Drop the device. Set a 5-minute timer. Stare at a wall and forcefully regulate breathing to 4-second intervals."},"longTermProtocol":{"mindsetShift":"Recognizing that hoarding responsibility is actually rooted in pride and a profound lack of trust in God's sovereignty.","structuralBoundary":"Instituting a hard, non-negotiable 24-hour Sabbath where absolutely zero emails are checked and no 'fires' are fought.","altarReplacement":"Dismantling the Altar of Control to build the Altar of Trust, structurally allowing subordinates to fail, learn, and carry the weight."},"caseStudies":[{"title":"Elijah at Mount Horeb","verse":"1 Kings 19:4","callings":["Prophet","The Raider"],"goodTraits":["Zealous","Faithful","Courageous"],"badTraits":["Hypervigilant","Isolated","Martyr Syndrome"],"journey":"Taking on the entire spiritual weight of the nation alone, climaxing at Carmel. Fleeing from Jezebel's threat into absolute isolation, begging to die because 'I alone am left'.","healing":"God bypassing the theology and treating the biology: sleep, baked bread, and water. Anointing Elisha and Jehu, and delegating the operational violence instead of hoarding the execution."},{"title":"Moses Striking the Rock","verse":"Numbers 20:10","callings":["Deliverer","Lawgiver"],"goodTraits":["Meek","Faithful","Intercessor"],"badTraits":["Overburdened","Frustrated","Reactionary"],"journey":"Carrying the emotional exhaustion of leading a rebellious people until it broke his emotional boundaries. Assuming the burden of the miracle onto himself: 'Must we bring you water out of this rock?'","healing":"The water flows, but God immediately sentences Moses for failing to hallow Him before the people. Moses submits to the consequence, handing leadership entirely over to Joshua without bitterness."},{"title":"Nehemiah on the Wall","verse":"Nehemiah 4:17","callings":["Builder","Governor"],"goodTraits":["Enduring","Strategic","Focused"],"badTraits":["Overworked","High-stress environment"],"journey":"Rebuilding the wall under constant psychological and physical threat. Enduring the sheer exhaustion of holding a trowel for building in one hand and a sword for defending in the other.","healing":"Completing the wall in 52 days not purely by his own strength, but by structuring the people to defend each other's families and deeply trusting that 'our God will fight for us.'"}],"react":{"fear":"Collapse — of the thing you're carrying, of the people you're protecting.","coreDesc":"Wired to outlast. Takes the problem no one else will touch. Rebuilds under pressure.","inverseDesc":"Volunteers for overwhelm, then resents carrying it alone. Rest feels like theft. Sabbath triggers guilt.","warfareMechanic":"Induces a false sense of responsibility, crushing the victim under the weight of outcomes they were never meant to carry. Feeds off the pride of martyrdom.","caseStudies":[{"name":"Elijah at Horeb","verse":"1 Kings 19:4","callings":["Prophet","The Raider"],"goodTraits":["Zealous","Faithful","Courageous"],"badTraits":["Hypervigilant","Isolated","Martyr Syndrome"],"fracture":"Taking on the entire spiritual weight of the nation alone, climaxing at Carmel.","counterfeitLoop":"Fleeing from Jezebel into absolute isolation, begging to die because 'I alone am left'.","divineInterruption":"God bypassing the theology and treating the biology: sleep, baked bread, water.","redemptivePivot":"Anointing Elisha and Jehu. Delegating operational violence instead of hoarding execution.","struggle":"His threat-filter was so hot Jezebel's threat collapsed him into burnout.","healing":"God reset his nervous system with Shalom and instructed him to delegate."},{"name":"Moses Striking the Rock","verse":"Numbers 20:10","callings":["Lawgiver","Deliverer"],"goodTraits":["Faithful","Intercessor"],"badTraits":["Exhausted","Reactive"],"fracture":"Carrying the emotional exhaustion of a rebellious people until it broke his boundaries.","counterfeitLoop":"Assuming the burden of the miracle: 'Must we bring you water out of this rock?'","divineInterruption":"The water flows, but God sentences Moses for failing to hallow Him.","redemptivePivot":"Moses submits to the consequence, handing leadership to Joshua without bitterness.","struggle":"C rations to govern what he would not.","isBlueprint":true}],"fivefold":[{"office":"Prophet","confidence":"partial","basis":"Archive bloodline canon: “the prophetic witness who tells the family what their eyes refuse to see.”"}],"fivefoldNone":null,"secular":{"label":"The Pioneer","pearson":"Explorer","gloss":"first-mover potential looking for a container"},"axisConfidence":"partial"}]},{"id":3,"name":"Joy ⇌ Depression","icon":"ph-activity","accent":{"key":"joy","hex":"#d9a03f"},"core":{"name":"Joy","desc":"The capacity to see beauty where others see ash. Resonance with God. (Nehemiah 8:10)"},"inverse":{"name":"Depression","desc":"A subconscious preference for the wound over the healing. (Prov 12:25)"},"principle":"The calling is to translate suffering into liberation for others. The attack is the refusal to let the wound close, because the wound became the platform.","altars":{"counterfeit":{"name":"Escapism","desc":"Idolizing emotional comfort or self-expression to avoid the pain of reality."},"godly":{"name":"Contentment","desc":"Remaining attached to Jesus as the sole source of satisfaction."}},"essay":{"coreText":"The fruit of right belief. Celebration of progress. Delight that moves outward. Resonance with the heartbeat of God. The capacity to see beauty where others see ash.","inverseText":"Heaviness. Pitifulness that calcifies into identity. A subconscious preference for the wound over the healing because the wound is a stable known. Crisis as self-concept.","counterfeitAltar":{"name":"The Altar of Escapism","desc":"Idolizing emotional comfort or self-expression to avoid the pain of reality. Freedom used irresponsibly as permission for what the soul was not yet ready to hold."},"godlyAltar":{"name":"The Altar of Contentment","desc":"Remaining attached to Jesus as the sole source of satisfaction. Needing nothing else because the One who is everything is already enough."}},"archetypes":[{"tribe":"Naphtali","name":"The Deer","symbol":"🦌","scripture":"\"Naphtali is a hind let loose: he giveth goodly words.\" - Gen 49:21","altars":{"counterfeit":"Escapism","godly":"Contentment"},"positiveTraits":["Joyful","Creative","Liberating","Artistic"],"shortStruggles":["Escapism","Victimhood","Isolation"],"shortPassions":["Healing","Empathy","Liberation"],"biblicalExamples":["Demoniac of Gadara","Man at Bethesda","Miriam","Jonah","Asaph","Jeremiah","Mary Magdalene"],"struggles":["Weaponizing vulnerability (using trauma dumping as a platform or defense).","Resisting healthy, structural boundaries by labeling them as \"cages\" or \"toxic\".","Subconsciously preferring the familiarity of the wound over the responsibility of actual healing.","Ghosting friends or churches the moment healthy friction is applied.","Addicted to melancholy or sad media because it feels \"authentic\" or \"real\".","Identifying so strongly with your mental health diagnosis that you actively defend it against healing."],"lubricant":"Actual healing (not the performance of healing).","warfare":{"name":"Spirit of Heaviness","mechanic":"Traps empathic capacity in an endless loop of processing pain without ever crossing into actual liberation."},"synthesis":{"burkGift":"Exhorter","traumaType":"Orphan (Lack of roots)","kellerIdol":"Approval & Comfort","spirit":"Heaviness","lie":"\"Freedom means never drawing hard lines or submitting to structure.\"","redemptiveArc":"<strong>Priest Arc:</strong> Embrace the necessary friction of truth-telling and actual healing; dismantle the Altar of Escapism by building a sustainable Altar of Contentment."},"symptomCluster":{"burnout":"Avoidance Burnout: The massive energetic cost of constantly running from necessary friction or conflict.","isolation":"Ghosting high-leverage partnerships the moment structural accountability is applied.","primaryShadow":"Escapism: Consuming new environments, new relationships, or new concepts to avoid settling and doing the work. (Prov 18:1)","godlyExpression":"Active Liberation: Deep empathy deployed to actively heal and free others within committed structures."},"neuroMechanics":{"emotionalSignature":"Intense claustrophobia; a paralyzing physical heaviness that convinces them movement is impossible.","traumaEcho":"The Orphan wound of rootlessness; a deep terror of being pinned down, controlled, or trapped in pain without an exit.","counterfeitReward":"The fleeting rush of 'freedom' that comes from abandoning a difficult commitment.","somaticTripwire":"A feeling of physical entrapment or shallow breathing when asked for a hard deadline or commitment.","ecosystemCollision":"Friction with Zebulun (The Merchant), whose obsession with metrics and ledgers feels like a suffocating cage to Naphtali.","firstFiveMinutes":"Do not pack your bags. Do not send the text. Sit in the discomfort of the 'cage' and identify the exact fear."},"longTermProtocol":{"mindsetShift":"Understanding that true freedom is only found *inside* of covenant and structure, not in constantly running from it.","structuralBoundary":"Committing to one local community, one job, or one primary relationship for an unalterable period of 3 years.","altarReplacement":"Dismantling the Altar of Escapism by building the Altar of Contentment—finding deep joy and liberation in the mundane, daily repetitions of life."},"caseStudies":[{"title":"Jonah's Flight","verse":"Jonah 1:3","callings":["Prophet","Messenger"],"goodTraits":["Sensitive to Spirit","Truthful"],"badTraits":["Avoidant","Prejudiced","Self-Pitying"],"journey":"Refusing to carry the heavy, structured assignment of delivering a hard word to Nineveh. Fleeing into the escapism of the ship, numbing out by sleeping in the hull during a massive crisis.","healing":"The storm and the whale: God forcing strict, inescapable confinement to trigger repentance. Submitting to the exact assignment he ran from, delivering the word without editing it for comfort."},{"title":"The Man at Bethesda","verse":"John 5:6","callings":["Testimony of Grace"],"goodTraits":["Patient (Misguided)"],"badTraits":["Victimhood","Excuses","Complacent"],"journey":"Trapped in paralysis for 38 years, internalizing the sickness as a core identity. Constantly making excuses for why healing was impossible ('I have no man to put me in the pool').","healing":"Jesus directly challenging the desire for true healing over the comfort of the wound: 'Wilt thou be made whole?' Standing up, walking out of the familiar, comfortable identity of the victim."},{"title":"Demoniac of Gadara","verse":"Mark 5:15","callings":["Evangelist","Living Testimony"],"goodTraits":["Restored","Obedient","Testifying"],"badTraits":["Self-destructive","Isolated","Tormented"],"journey":"Completely possessed by a legion of heaviness, cutting himself, living isolated in the tombs. Breaking every chain of human structure, demanding total, chaotic 'freedom' through madness.","healing":"Jesus commands the legion of heaviness to leave. The man is found fully clothed and in his right mind, sitting at the feet of Jesus, and is immediately commissioned to evangelize his city."}],"react":{"fear":"Captivity — any structure that pattern-matches to the old cage.","coreDesc":"Wired to turn wounds into healing. Sees beauty where others see ash. Brings freedom into spaces locked by fear.","inverseDesc":"Every boundary reads as the old cage trying to close. Relates more to the wound than the healing.","warfareMechanic":"Traps empathic capacity in an endless loop of processing pain without ever crossing over into actual liberation.","caseStudies":[{"name":"The Demoniac of Gadara","verse":"Mark 5:15","callings":["The Deer","Liberator","Evangelist"],"goodTraits":["Testifier","Restored Mind"],"badTraits":["Self-destructive","Isolated","Tormented"],"fracture":"Lived among the tombs, finding entire identity in torment and isolation.","counterfeitLoop":"The wound calcified into who he was; the chains kept breaking but the identity didn't.","divineInterruption":"Encountering Jesus, who cast out the legion of hea ples":["The artist whose trauma testimony built the platform — and who can't write past the wound because the wound is the brand.","The recovery group regular who's been 'just about to graduate' for six years.","The friend who labels every loving correction as 'toxic' and ghosts the relationship.","The leader who jumps churches every 18 months as soon as accountability arrives.","The creative who needs a new city every two years to feel 'alive'."],"scriptureVault":[{"label":"Covenant","ref":"Genesis 49:21","text":"Naphtali is a doe set free that bears beautiful fawns."},{"label":"Calling","ref":"Deuteronomy 33:23","text":"Naphtali is abounding with the favor of the Lord and is full of his blessing."},{"label":"Fall","ref":"John 5:6","text":"When Jesus saw him lying there and learned that he had been in this condition for a long time, he asked him, 'Do you want to get well?'"},{"label":"Prophetic","ref":"Isaiah 61:1-3","text":"The Spirit of the Sovereign Lord is on me, because the Lord has anointed me to proclaim good news to the poor... to bestow on them a crown of beauty instead of ashes."},{"label":"NT Echo","ref":"Mark 5:15","text":"When they came to Jesus, they saw the man who had been possessed by the legion of demons, sitting there, dressed and in his right mind."},{"label":"Liberation","ref":"John 8:36","text":"So if the Son sets you free, you will be free indeed."},{"label":"Redemption","ref":"Nehemiah 8:10","text":"Do not grieve, for the joy of the Lord is your strength."}]},"bloodline":{"id":"bl-naphtali","slug":"naphtali","category":"bloodline","title":"Naphtali","domain":"Word / Beautiful Speech","tribe":"Naphtali","tagline":"The doe set free who gives beautiful words.","trueCalling":{"essence":"Naphtali is 'a doe let loose that bears beautiful fawns' — or, in another reading, 'that gives beautiful words.' Naphtali is the bloodline of the swift, free messenger whose speech delivers what was wrestled for.","mandate":"To run with good news, to speak beauty e":"partial","basis":"Canon case study: the Demoniac commissioned to proclaim (Mark 5:19–20); v8 tags the case ‘Evangelist, Living Testimony’."}],"fivefoldNone":null,"secular":{"label":"The Artist","pearson":"Creator","gloss":"the wound-turned-healer; beauty as liberation"},"axisConfidence":"strong"}]},{"id":4,"name":"Dominion ⇌ Intimidation","icon":"ph-crown","accent":{"key":"dominion","hex":"#c2402e"},"core":{"name":"Dominion","desc":"Authorized governance. Strength that protects rather than consumes. (Psalm 72:8)"},"inverse":{"name":"Intimidation","desc":"Rule through fear. Devouring allies to stay on top. (1 Pet 5:3)"},"principle":"The calling on this axis is to carry weight others cannot. The attack turns the weight-bearer into a consumer — of allies, of credit, of the kingdom.","altars":{"counterfeit":{"name":"Grind Culture","desc":"Idolizing self-reliance and status. Functionally believing 'I must build it myself'."},"godly":{"name":"Purity in Government","desc":"Exercising authority without prostituting the gift for personal gain."}},"essay":{"coreText":"Ruling and governing as an authorized representative of the Kingdom. Strength under commission. Authority that protects rather than consumes. Power that carries weight others cannot.","inverseText":"Rule through fear rather than commission. Chronic second-guessing that suffocates the anointing. Leadership that devours its own to stay on top. Authority deployed to defend the self rather than shelter the sent.","counterfeitAltar":{"name":"The Altar of Grind Culture","desc":"Idolizing self-reliance, status, and human effort. Functionally believing \"I must build it myself\" while operating in the economy of Satan."},"godlyAltar":{"name":"The Altar of Purity in Government","desc":"Exercising authority without prostituting the gift for personal gain. Submitting all strategy to the Holy Spirit. Ruling as the sent, not as the self-commissioned."}},"archetypes":[{"tribe":"Judah","name":"The Lion","symbol":"🦁","scrip cial Authority: Wielding power to protect, empower, and elevate subordinates."},"neuroMechanics":{"emotionalSignature":"A toxic entitlement masquerading as 'destiny'; deep, burning frustration when not immediately recognized or deferred to.","traumaEcho":"The Widow wound of losing the kingdom; a subconscious terror of being invisible, irrelevant, or replaced.","counterfeitReward":"The adrenaline spike of public applause and unquestioned authoritative leverage.","somaticTripwire":"A flare of intense anger or physical heat in the face when someone else receives public credit for a shared victory.","ecosystemCollision":"Friction with Dan (The Judge), as Judah hates being critiqued and Dan specializes in identifying fatal flaws.","firstFiveMinutes":"Deflect credit publicly. Force yourself to verbally praise a subordinate's specific contribution."},"longTermProtocol":{"mindsetShift":"Embracing the truth that true Sonship is established in the secret place, entirely independent of public output or metrics.","structuralBoundary":"Enforcing seasons of mandatory anonymity—giving, serving, and building where credit is structurally impossible to receive.","altarReplacement":"Replacing the Altar of Grind/Performance with the Altar of Purity—leading from a place of secure identity rather than grasping for conquest."},"caseStudies":[{"title":"David at the Window","verse":"2 Samuel 11:1","callings":["King","Worshiper"],"goodTraits":["Repentant","Heart for God"],"badTraits":["Lustful","Idle","Impulsive"],"journey":"Refusing to carry the proper weight of the season (staying home from the war). Idleness leading to entitlement. 'I am king, I can consume what I see.' (Bathsheba).","healing":"Nathan the Prophet utilizing a specific story to bypass David's narcissistic defenses. Extreme, public repentance and a return to menial, submitted service to God over self-preservation."},{"title":"King Uzziah's Pride","verse":"2 Chronicles 26:16","callings":["King","Builder"],"goodTraits":["Innov ationships where Joseph holds all the power and takes zero emotional risk. (Prov 18:19)","godlyExpression":"Vulnerable Administration: Building resilient systems while maintaining open, forgiving relationships."},"neuroMechanics":{"emotionalSignature":"A cold, calculated detachment; feeling completely numb, analytical, and entirely walled off from human messiness.","traumaEcho":"The Widow wound of deep betrayal by close family or leadership; a vow that 'no one will ever have the power to hurt me again.'","counterfeitReward":"The cold, sterile safety of absolute invulnerability.","somaticTripwire":"A sudden physical chilling or emotional 'numbing out' when someone asks a probing, personal question.","ecosystemCollision":"Friction with Benjamin (The Wolf), as Benjamin's chaotic intensity constantly threatens Joseph's highly ordered systems.","firstFiveMinutes":"Do not retreat into data. Force eye contact. Say out loud, 'I am feeling defensive right now.'"},"longTermProtocol":{"mindsetShift":"Accepting that impenetrable emotional armor prevents both pain *and* the vulnerability required for actual, anointed leadership.","structuralBoundary":"Scheduling daily relational check-ins that focus exclusively on *emotions* and subjective experiences, entirely devoid of task-lists or metrics.","altarReplacement":"Dismantling the Altar of Armor (stonewalling) and building the Altar of Forgiveness, actively releasing the ledger of wrongs held against past betrayers."},"caseStudies":[{"title":"Joseph Testing His Brothers","verse":"Genesis 42:7","callings":["Administrator","Savior of Nations"],"goodTraits":["Resilient","Brilliant","Pure"],"badTraits":["Controlling (Initially)","Withholding"],"journey":"Carrying the unhealed wound of deep betrayal by his own blood. Using his immense administrative power to intensely test his brothers before risking vulnerability.","healing":"Judah offering his own life in exchange for Benjamin, proving the brothers had changed. Joseph completely bre ost the critique. Pray explicitly for the blessing and restoration of the target."},"longTermProtocol":{"mindsetShift":"Absorbing the reality that the wrath of man does not produce the righteousness of God. Cruelty is never justified by accuracy.","structuralBoundary":"A total and complete fast from engaging in any online theological debates, 'call-out' culture, or public rebukes.","altarReplacement":"Replacing the Altar of Uncommissioned Zeal (which leads to massacre) with Zeal Under Commission—acting only when bounded entirely by radical mercy."},"caseStudies":[{"title":"Sons of Thunder","verse":"Luke 9:54","callings":["Apostles","Inner Circle"],"goodTraits":["Passionate","Loyal","Bold"],"badTraits":["Vengeful","Merciless","Hot-headed"],"journey":"Experiencing rejection from a Samaritan village. Asking Jesus to call down fire from heaven to obliterate the village in 'righteous zeal'.","healing":"Jesus rebuking them: 'You do not know what kind of spirit you are of.' Temper the blade. Deploy zeal strictly under God's commission, bounded entirely by radical mercy."},{"title":"Massacre at Shechem","verse":"Genesis 34:25","callings":["Guards","Protectors"],"goodTraits":["Protective","Zealous"],"badTraits":["Cruel","Deceitful","Vindictive"],"journey":"Deep, righteous pain over the defilement of their sister Dinah. Weaponizing a religious covenant (circumcision) to enact an utterly disproportionate, scorched-earth slaughter of a whole city.","healing":"Jacob rebuking them for making him a stench to the inhabitants of the land. Simeon's tribe is later scattered, showing that uncommissioned zeal destroys one's own inheritance."},{"title":"Peter with the Sword","verse":"John 18:10","callings":["Apostle","The Rock"],"goodTraits":["Protective","Bold","Committed"],"badTraits":["Reactive","Fleshly","Outraged"],"journey":"Relying on the flesh and uncommissioned zeal during the garden arrest. Striking the high priest's servant and cutting off his ear to protect the Kingdom by raw s?","After you 'defend' someone, do you secretly enjoy the destruction more than their healing?","Do you scatter the people you were sent to gather?","Is your zeal a way of avoiding your own grief?"],"lubricant":"The clean burn of righteous anger — the dopamine of being the one who finally said the thing. Catharsis mistaken for breakthrough.","legalAccess":"The Shechem massacre — using covenant (circumcision) as a weapon. The altar gains jurisdiction wherever holy things are weaponized for personal vengeance.","fruitInLife":["Burned bridges left smoking","A trail of 'necessary' confrontations","Loyal allies who quietly fear you","Chronic relational exile"]},"countermove":{"name":"Covenant Sword","remedyHeadline":"Sheathe the sword until it is drawn for covenant — never for grievance.","description":"Simeon is restored when his sword answers only to covenant — when he intercedes before he confronts, and weeps before he strikes.","repentancePattern":["Confess the names of those you scattered while claiming to defend","Renounce vengeance dressed in scripture","Receive the grief beneath the rage","Submit your sword to a covenant elder before you draw it"],"ancientCase":"Simeon was scattered in Israel (Gen 49:7) — a calling fulfilled became a curse when zeal outran covenant. The remnant in 1 Chronicles 4 recovered the line by waging only the wars God commanded.","modernTranslation":"The activist whose causes are righteous and whose relationships are ash. The pastor who 'speaks truth' and leaves churches in pieces. The watchman whose alerts are accurate and whose tone is unbearable.","decree":"My sword answers to covenant. I will weep before I strike, and I will gather what I am sent to defend."},"frequencies":{"core":{"name":"Covenant Zeal","signature":"A heat that warms before it burns; confrontation that ends in embrace."},"inverse":{"name":"Vengeful Heat","signature":"Adrenaline-laced clarity, narrowed eyes, the urge to finish it now."},"neurochemistry":"Inverse runs
