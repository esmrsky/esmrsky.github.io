s":["Protective","Bold","Committed"],"badTraits":["Reactive","Fleshly","Outraged"],"journey":"Relying on the flesh and uncommissioned zeal during the garden arrest. Striking the high priest's servant and cutting off his ear to protect the Kingdom by raw force.","healing":"Jesus sharply rebukes him ('Put your sword away'), actively reversing the damage by healing the enemy's ear, demonstrating that His kingdom does not fight like the world.","isBlueprint":true}],"fivefold":[],"fivefoldNone":"No clean mapping. Commissioned zeal has no office of its own; it serves under whichever office sends it.","secular":{"label":"The Reformer","pearson":"Hero / Crusader","gloss":"the edge that will not let evil pass"},"axisConfidence":"strong"}]},{"id":5,"name":"Generosity ⇌ Scarcity","icon":"ph-coins","accent":{"key":"generosity","hex":"#8aa04a"},"core":{"name":"Generosity","desc":"Operating out of Kingdom abundance. Multiplication. (Proverbs 11:24)"},"inverse":{"name":"Scarcity","desc":"Spirit of lack. Withholding. Every relationship priced. (Hag 1:6)"},"principle":"The calling on this axis is to multiply what is entrusted. The attack is the quiet conviction that the entrusted is actually yours.","altars":{"counterfeit":{"name":"Mammon","desc":"Idolizing money and transactional success. Attributing outcomes to one's own strategy."},"godly":{"name":"Generosity","desc":"Giving secretly and consistently to create a spiritual vacuum that pulls in divine multiplication."}},"essay":{"coreText":"The electrical currency of increase. Operating out of the Kingdom's abundance. Open-handedness as the proof that the resource was never yours to hoard.","inverseText":"Spirit of lack. Withholding. The fear of running out even when the barns are full. Ledger mentality. Every relationship priced. Every gift audited for repayment potential.","counterfeitAltar":{"name":"The Altar of Mammon","desc":"Idolizing money, increase, and transactional success (Matt 6:24). In the adjacent Welch framing, this is also the Altar of Baal: the self-reliance underneath the hustle — attributing outcomes to one's own strategy rather than to God, and using generosity as a performance of control."},"godlyAltar":{"name":"The Altar of Generosity","desc":"Giving secretly and consistently to create a spiritual vacuum that pulls in divine multiplication. Complete disconnection from Mammon's economy."}},"archetypes":[{"tribe":"Zebulun","name":"The Merchant","symbol":"⚓","scripture":"\"Zebulun shall dwell at the haven of the sea; and he shall be for an haven of ships...\" - Gen 49:13","altars":{"counterfeit":"Mammon","godly":"Generosity"},"positiveTraits":["Generous","Multiplying","Resourceful","Strategic"],"shortStruggles":["Greed","Hoarding","Workaholism"],"shortPassions":["Multiplication","Generosity","Scaling"],"biblicalExamples":["Zacchaeus","Ananias & Sapphira","Rich Young Ruler","Matthew","Joseph of Arimathea","Lydia","Cornelius"],"struggles":["Tying personal self-worth entirely to net-worth, revenue, or productivity metrics.","Struggling to be present with family when business is flat or declining.","Justifying extreme resource hoarding by rebranding it as \"wise stewardship\".","Monetizing every hobby, relationship, or sacred space (transactionalizing grace).","Feeling physically sick or deeply anxious when having to spend money unexpectedly.","Refusing to invest in your own emotional/spiritual healing because it \"costs too much.\""],"lubricant":"Open horizons with something real to multiply.","warfare":{"name":"Baal / Mammon","mechanic":"Turns open-handed Kingdom finance into transactional spiritual bondage where giving is used to control outcomes."},"synthesis":{"burkGift":"Giver","traumaType":"Orphan (Terror of Scarcity)","kellerIdol":"Comfort & Control","spirit":"Baal/Mammon","lie":"\"Constant expansion justifies my half-obedience.\"","redemptiveArc":"<strong>King Arc:</strong> Wield radical generosity as active spiritual warfare; completely dismantle the Altar of Mammon by trusting implicitly in divine, rather than manufactured, provision."},"symptomCluster":{"burnout":"Acquisition Burnout: The despair that hits when a flat revenue line or missed target invalidates their identity.","isolation":"Transactional Isolation: Having a massive network but no true friends because everyone is viewed as a leverage point.","primaryShadow":"Transactional Hoarding: Monetizing every relationship, hobby, and sacred space; an insatiable appetite for 'more'. (1 Tim 6:10)","godlyExpression":"Radical Generosity: Open-handed Kingdom multiplication that purely funds the harvest."},"neuroMechanics":{"emotionalSignature":"A low-grade panic regarding provisions, driving a compulsive need to calculate, monetize, and secure the future.","traumaEcho":"The Orphan wound of scarcity; a deeply ingrained terror that resources will run out and they will be left destitute.","counterfeitReward":"The dopamine hit of the 'deal closed' or the bank balance increasing, temporarily silencing the fear of lack.","somaticTripwire":"A sudden sinking feeling in the gut when a client pauses or a metric trends downward for even a day.","ecosystemCollision":"Friction with Naphtali (The Deer), viewing Naphtali's free-spirited lack of structure as lazy and unprofitable.","firstFiveMinutes":"Give something away immediately. Break the scarcity loop by writing an unprompted check or giving away a resource for free."},"longTermProtocol":{"mindsetShift":"Shifting from the belief that 'I am the provider' to 'God is my source, and I am merely the conduit.'","structuralBoundary":"Automating generous giving so it happens painfully, primarily, and off the top, bypassing the opportunity to hoard.","altarReplacement":"Dismantling the Altar of Mammon (controlling outcomes through money) to establish the Altar of Generosity, deploying capital solely for Kingdom multiplication."},"caseStudies":[{"title":"Ananias and Sapphira","verse":"Acts 5:2","callings":["Contributors","Church Members"],"goodTraits":["Desire to participate"],"badTraits":["Deceitful","Hoarding","Vain"],"journey":"Wanting the public prestige of generosity while secretly operating under the terror of scarcity. Lying to the Holy Spirit to keep a portion for themselves while pretending to give it all.","healing":"Peter's exposure of the root lie, resulting in immediate, fatal consequence. Serves as a terrifying baseline warning against allowing Mammon to co-opt the Altar of Generosity."},{"title":"The Rich Young Ruler","verse":"Mark 10:21","callings":["Steward","Leader"],"goodTraits":["Law-abiding","Seeking truth","Reverent"],"badTraits":["Greed","Comfort-seeking","Idolatrous"],"journey":"Desiring eternal life but entirely enmeshed with his vast possessions. Keeping the moral laws flawlessly but refusing to release his grip on his ledger.","healing":"Jesus loving him, and telling him to sell everything and give it to the poor. He walked away sad, choosing the Altar of Mammon over the invitation to follow the King."},{"title":"Zacchaeus the Tax Collector","verse":"Luke 19:8","callings":["Chief Publican","Merchant"],"goodTraits":["Resourceful","Seeking Jesus"],"badTraits":["Extortionist","Greedy","Hoarder"],"journey":"Climbing a tree just to see Jesus, heavily insulated by the wealth he had stolen from his own people, operating entirely out of the spirit of Mammon.","healing":"Jesus invites Himself over. Zacchaeus completely dismantles his altar in response to grace, giving half his goods to the poor and restoring 4x to anyone he defrauded."}],"react":{"fear":"Stagnation. A flat line on any metric feels like death.","coreDesc":"Wired to multiply what is entrusted. Turns small things into scaled things. Builds engines of abundance.","inverseDesc":"Monetization drift. Progress addiction; a flat week triggers existential dread. The moving milestone.","warfareMechanic":"Demands self-idolatry and weaponizes generosity. Turns Kingdom finance into transactional bondage.","caseStudies":[{"name":"Zacchaeus","verse":"Luke 19:8","callings":["The Merchant","Giver"],"goodTraits":["Repentant","Radically Generous"],"badTraits":["Extortioner","Corrupt"],"fracture":"Hoarded immense wealth through extortion, driven by deep social and physical inadequacy.","counterfeitLoop":"Building security through extraction from his own people.","divineInterruption":"Jesus simply inviting Himself over for dinner — pure presence, no sermon.","redemptivePivot":"Spontaneous, radical generosity (giving back 4x). The idol of Mammon shattered by grace.","struggle":"Scarcity drove him to extract from community.","healing":"Presence of grace shattered Mammon; generosity overflowed."},{"name":"Ananias and Sapphira","verse":"Acts 5:2","callings":["Contributors"],"goodTraits":["Desire to participate"],"badTraits":["Deceitful","Hoarding","Vain"],"fracture":"Wanted the public prestige of generosity while operating under terror of scarcity.","counterfeitLoop":"Lying to the Holy Spirit to keep a portion while pretending to give it all.","divineInterruption":"Peter exposing the root lie, with immediate fatal consequence.","redemptivePivot":"Failure to pivot; serves as a permanent warning against performative generosity.","struggle":"Performed generosity while serving Mammon.","healing":"Missed."}]},"essay":{"emoji":"🪙","epithet":"The Merchant","callingPole":"Wired to multiply what is entrusted. Turns small things into scaled things. Builds engines of abundance. Funds what God is doing in the earth.","attackPole":"Monetization drift — converts what should stay free into transaction. Progress addiction; a flat week triggers existential dread. Half-obedience: \"I'll do what God said, after this next milestone.\" The milestone always moves.","lubricant":"Open horizons with something real to multiply. Merchants go crazy in static environments — the fix is a worthy container, not killing the gift.","coreFear":"Stagnation. A flat line on any metric feels like death.","scriptureAnchor":"\"Zebulun shall dwell at t ibly, for the Lord's salvation before judging"],"ancientCase":"Samson, the Danite, judged Israel from raw power and died blind. The Danite calling fulfilled is judgment that does not need its own visibility — and that waits.","modernTranslation":"The discerner who screenshots. The pastor with a file on the elders. The intercessor whose 'words' are character assassinations dressed in scripture.","decree":"I judge in the gate, in the light, under covenant. I wait for the Lord's salvation. My discernment serves the bride, not my standing."},"frequencies":{"core":{"name":"Open Judgment","signature":"Clarity spoken before witnesses; the long patience of the watchman."},"inverse":{"name":"Coiled Suspicion","signature":"Constant threat-scanning; the reflex to strike before being seen."}},"related":{"callings":["prophet","watchman"],"altars":["python","high-places"],"frequencies":["control-surrender"]}},"axisId":6,"axisName":"Truth ⇌ Deception","blueprint":{"figure":"Thomas","reactCase":"Thomas the Twin","v8Case":null,"lineage":{"label":"wiring-match","note":"Lineage unstated. Canon’s Dan scripture-vault carries the ‘Thomas’ label; wiring-match."},"wiring":["John 20:24–25"],"redemption":["John 20:26–29"],"why":"The withheld verdict and demanded evidence — answered inside the community he had stayed near — becoming the highest confession in the gospel: ‘My Lord and my God.’","arc":{"name":"Thomas the Twin","verse":"John 20:25","callings":["The Judge","Apostle"],"goodTraits":["Honest","Devoted","Inquiring"],"badTraits":["Cynical","Doubtful","Pessimistic"],"fracture":"Deeply cynical after the crucifixion; refused the joyful testimony of his community.","counterfeitLoop":"Demanding physical, irrefutable proof to protect himself from further disappointment.","divineInterruption":"Jesus did not scold his intellect; He met cynicism with grace, offering His scars.","redemptivePivot":"Moved instantly from toxic doubt to the highest confession in the Gospels: 'My Lord and my God!'","struggle":"Cynicism as armor against further wound.","healing":"Met by grace; collapsed into worship."},"v8Arc":null},"allCases":[{"title":"The Accuser of the Brethren","verse":"Revelation 12:10","callings":["The Judge","Protector"],"goodTraits":["Discerning","Accurate"],"badTraits":["Toxic","Accusing","Destroying"],"journey":"Using technically accurate facts delivered with a completely toxic, demonic spirit to destroy. Nitpicking and critiquing the message instead of actually worshiping, tearing down the house from the inside.","healing":"The blood of the Lamb and the word of their testimony silencing the accusation. Rebuild broken systems with love and restorative judgment rather than toxic, tearing critique.","isBlueprint":false},{"title":"The Rogue Priesthood","verse":"Judges 18:30","callings":["The Judge","Fierce Protectors"],"goodTraits":["Strong","Cunning"],"badTraits":["Idolatrous","Rogue","Divisive"],"journey":"Refusing to fight for their allotted inheritance, opting for an easier path. Setting up their own private idols and a rogue, unaccountable priesthood in the north.","healing":"The eventual captivity of the land, demonstrating that un-submitted judgment leads to exile. Submitting discernment to covenant community rather than operating as an isolated, cynical critic.","isBlueprint":false},{"title":"Miriam's Slander","verse":"Numbers 12:1","callings":["Prophetess","Leader"],"goodTraits":["Worshiper","Vigilant","Protective"],"badTraits":["Critical","Jealous","Slanderous"],"journey":"Using a technically accurate fact (Moses marrying a Cushite) as a cloak to launch a toxic, cynical attack on his ultimate authority, demanding equality.","healing":"Struck with leprosy and shut out of the camp for 7 days. Restored only because the very leader she accused (Moses) humbly interceded for her healing.","isBlueprint":false},{"title":"Thomas the Twin","verse":"John 20:25","callings":["The Judge","Apostle"],"goodTraits":["Honest","Devoted","Inquiring"],"badTraits":["Cynical","Doubtful","Pessimistic"],"arc":{"name":"Thomas the Twin","verse":"John 20:25","callings":["The Judge","Apostle"],"goodTraits":["Honest","Devoted","Inquiring"],"badTraits":["Cynical","Doubtful","Pessimistic"],"fracture":"Deeply cynical after the crucifixion; refused the joyful testimony of his community.","counterfeitLoop":"Demanding physical, irrefutable proof to protect himself from further disappointment.","divineInterruption":"Jesus did not scold his intellect; He met cynicism with grace, offering His scars.","redemptivePivot":"Moved instantly from toxic doubt to the highest confession in the Gospels: 'My Lord and my God!'","struggle":"Cynicism as armor against further wound.","healing":"Met by grace; collapsed into worship."},"reactOnly":true,"isBlueprint":true},{"title":"The Tribe of Dan","verse":"Judges 18:30","callings":["Protector"],"goodTraits":["Discerning","Fierce"],"badTraits":["Idolatrous","Rogue","Divisive"],"arc":{"name":"The Tribe of Dan","verse":"Judges 18:30","callings":["Protector"],"goodTraits":["Discerning","Fierce"],"badTraits":["Idolatrous","Rogue","Divisive"],"fracture":"Refusing to fight for their allotted inheritance, opting for an easier path.","counterfeitLoop":"Setting up private idols and a rogue, unaccountable priesthood in the north.","divineInterruption":"The eventual captivity of the land.","redemptivePivot":"Failure — Dan is ominously missing from the list of the 144,000 in Revelation.","struggle":"Discernment without covenant became idolatry.","healing":"Tragic missed trajectory."},"reactOnly":true,"isBlueprint":false}],"fivefold":[{"office":"Prophet","confidence":"partial","basis":"Archive relates Watchman ↔ Prophet ↔ Dan (discernment-verdict adjacent to the prophetic)."}],"fivefoldNone":null,"secular":{"label":"The Auditor","pearson":"Sage (critic variant)","gloss":"the verdict that protects — when rendered in community"},"axisConfidence":"strong"}]}],"resonance":[{"tribe":"Benjamin","axis":1,"quote":"Benjamin (primary: Dominion) carries a loyalty-trigger that activates on this axis — perceived disloyalty reads as rejection, and the wolf responds."},{"tribe":"Naphtali","axis":1,"quote":"Naphtali (primary: Joy) does its deepest healing work on this axis — freedom after rejection is the gift it brings others."},{"tribe":"Levi","axis":1,"quote":"Levi can touch Love/Rejection when the gatekeeping is really a wound about belonging."},{"tribe":"Asher","axis":2,"quote":"Asher (primary: Love) touches this axis — comfort-seeking is often dysregulation-avoidance, not peace."},{"tribe":"Issachar","axis":2,"quote":"Issachar (primary: Truth) touches this axis — analysis paralysis is the sage's anxiety response dressed as wisdom."},{"tribe":"Joseph","axis":3,"quote":"Joseph (primary: Dominion) does adjacent work — resilience after betrayal can either crystalize into joy (Gen 50:20) or calcify into armor. The choice happens on this axis."},{"tribe":"Dan","axis":4,"quote":"Dan (primary: Truth) can slide onto this axis when verdict becomes weapon rather than protection."},{"tribe":"Reuben","axis":5,"quote":"Reuben (primary: Peace) touches this axis — appetite-for-what-isn't-yours is scarcity-driven grasping, not just impulsivity."},{"tribe":"Judah","axis":5,"quote":"Judah (primary: Dominion) can slide here when the weight-bearer begins treating platform and audience as ownable capital."}],"subFrequencies":[{"id":"fp-rejection-sonship","core":{"name":"Sonship","signature":"I am the Father's beloved before I do anything; my belovedness precedes my work."},"inverse":{"name":"Rejection","signature":"I am only as loved as my last performance; I scan rooms for proof of belonging."},"axis":1,"confidence":"strong"},{"id":"fp-orphan-adoption","core":{"name":"Adoption","signature":"I have a Father whose face is toward me; my inheritance is secure; I belong to a family."},"inverse":{"name":"Orphan","signature":"Whatever I get, I had to take. No one is coming. I have to provide for, defend, and parent myself."},"axis":1,"confidence":"partial"},{"id":"fp-shame-glory","core":{"name":"Glory","signature":"I am being changed from one degree of glory to another; my face is uncovered before Him."},"inverse":{"name":"Shame","signature":"I cannot be seen as I am; I cover myself with leaves; I hide."},"axis":null,"confidence":"none"},{"id":"fp-scarcity-provision","core":{"name":"Provision","signature":"Yahweh sees, Yahweh provides — exactly what is needed, in the moment of obedience."},"inverse":{"name":"Scarcity","signature":"There is not enough. I must hoard, hedge, and out-strive the future."},"axis":5,"confidence":"strong"},{"id":"fp-jealousy-honor","core":{"name":"Honor","signature":"I bless the gift of God on others; their flourishing increases my joy."},"inverse":{"name":"Jealousy","signature":"Their gift exposes my lack; their flourishing diminishes me."},"axis":5,"confidence":"partial"},{"id":"fp-intimidation-boldness","core":{"name":"Boldness","signature":"I speak the word with all boldness, the Spirit's breath in my chest."},"inverse":{"name":"Intimidation","signature":"My breath is constricted; the room owns my voice; I edit before I speak."},"axis":4,"confidence":"strong"},{"id":"fp-striving-rest","core":{"name":"Rest","signature":"I have entered His rest; my labor is from fullness, not toward worth."},"inverse":{"name":"Striving","signature":"I must produce my own ground to stand on. Rest feels like erasure."},"axis":2,"confidence":"strong"},{"id":"fp-performance-belovedness","core":{"name":"Belovedness","signature":"I am loved before I produce. The Father's pleasure is not my paycheck."},"inverse":{"name":"Performance","signature":"I am loved as long as I produce. My output is my standing."},"axis":1,"confidence":"strong"},{"id":"fp-control-surrender","core":{"name":"Surrender","signature":"Not my will but yours. I open my hands first, then receive what He gives."},"inverse":{"name":"Control","signature":"If I do not manage this outcome, no one will. My grip is my faith."},"axis":2,"confidence":"strong"},{"id":"fp-visibility-hidden","core":{"name":"Hidden Faithfulness","signature":"Seen by the Father in secret; reward in the Father's eye, not the room's."},"inverse":{"name":"Visibility Hunger","signature":"I do not exist if I am not seen; the platform is the air I breathe."},"axis":4,"confidence":"strong"},{"id":"fp-bitterness-forgiveness","core":{"name":"Forgiveness","signature":"I release the debt; I bless the offender; my heart is unclenched."},"inverse":{"name":"Bitterness","signature":"I rehearse the offense; the offender owes me; my chest carries the file."},"axis":3,"confidence":"partial"},{"id":"fp-despair-hope","core":{"name":"Hope","signature":"I rejoice in hope of the glory of God; the morning is coming I have not yet seen."},"inverse":{"name":"Despair","signature":"Nothing will change. The story has ended. I am rehearsing my own funeral."},"axis":3,"confidence":"strong"}],"sources":[{"name":"Francis Myles","domain":"Altars & thrones","contribution":"Named the altar–throne mechanism: every recurring sin in a life or a region is fed by an altar, and every altar enthrones a spirit. The Atlas's altar dossiers (Mammon, Jezebel, Molech, Babel, etc.) sit on this frame.","overlap":"Altar archetypes; the altar–spirit pairing; counter-altar logic.","addition":"The Atlas pairs each altar with the specific bloodline and calling most vulnerable to it, and renders the counter-altar inside every dossier — not as theory, but as a place to walk."},{"name":"Arthur Burk","domain":"Redemptive gifts & tribal blessings","contribution":"Identified the seven redemptive gifts of Romans 12 (Prophet, Servant, Teacher, Exhorter, Giver, Ruler, Mercy) and paired each with a curse-spirit it must overcome. Also expanded the tribal blessings of Genesis 49 / Deuteronomy 33 into vocational portraits.","overlap":"Redemptive Gifts category; tribal callings; curse-spirit pairings.","addition":"The Atlas treats redemptive gift and bloodline as two coordinates of innate design, then traces both into the wound-vow-altar chain."},{"name":"Robert Henderson","domain":"Courts of Heaven","contribution":"Reframed deliverance as a legal proceeding: the accuser brings cases, the believer comes by the blood, and decrees are issued from a courtroom rather than a battlefield.","overlap":"Legal-access language in every dossier; the decree as juridical speech.","addition":"The Atlas does not duplicate the courts walkthrough; it names the legal access point in each calling so the reader knows what case is being argued."},{"name":"Derek Prince","domain":"Generational curses","contribution":"Traced how iniquity is passed through bloodlines — Exodus 20:5 worked out pastorally — and gave the church a vocabulary for renouncing inherited bondage.","overlap":"The bloodline frame; renunciation as a step in every repentance pattern.","addition":"The Atlas grounds generational language in the twelve specific tribal callings and their named warnings, not generic 'family curses.'"},{"name":"Tim Keller","domain":"Deep idols","contribution":"Named the four heart-dispositions beneath every surface idol: Power, Approval, Comfort, Control. Showed that the gospel does not just forbid idols — it dethrones them by satisfying the underlying hunger.","overlap":"The Deep Idols category; the lie-quote pattern; gospel countermove logic.","addition":"The Atlas binds each deep idol to the altars it feeds and the bloodlines most prone to it, so the diagnostic and the deliverance share one map."},{"name":"Dan Allender","domain":"Trauma & the soul","contribution":"Identified the three biblical trauma archetypes — Orphan, Stranger, Widow — and described how each wound trains the heart toward a particular survival strategy.","overlap":"The Trauma Archetypes category; the wound → vow → altar chain.","addition":"The Atlas links each archetype to specific altars and idols so the redemptive arc has a named destination, not just a feeling."}],"categories":{"calling":{"label":"Callings","description":"Vocational mandates — five-fold, governmental, marketplace.","tone":"gold"},"bloodline":{"label":"Bloodlines","description":"The twelve tribal callings — generational anointings and warnings.","tone":"gold"},"redemptive-gift":{"label":"Redemptive Gifts","description":"The seven design-gifts of Romans 12 — each paired with the curse-spirit it must overcome.","tone":"gold"},"idol":{"label":"Deep Idols","description":"The four heart-dispositions beneath every surface idol — Power, Approval, Comfort, Control.","tone":"ember"},"trauma":{"label":"Trauma Archetypes","description":"The three biblical wounds — Orphan, Stranger, Widow — and the redemptive arc out of each.","tone":"ember"},"altar":{"label":"Altars","description":"Archetypal gateways through which idols gain legal access.","tone":"ember"},"frequency":{"label":"Frequencies","description":"Paired core ↔ inverse signatures running through the body and the room.","tone":"neutral"}},"compendium":{"altars":[{"id":"al-molech","slug":"molech","category":"altar","title":"Molech","domain":"Altar Archetype","tagline":"The altar that demands the children for the sake of the future.","trueCalling":{"essence":"Molech is the archetypal altar of child-sacrifice — the demand that what is most beloved be passed through the fire for the sake of the kingdom-to-come. Wherever a vision requires the offering of the next generation (literal or relational), Molech is being served.","mandate":"(Recognizing Molech is itself the mandate.) The Lord's vision is built on consecration, not consumption — He provided the Lamb so we would not need to offer the children.","scripture":[{"ref":"Leviticus 18:21","text":"You shall not give any of your children to offer them to Molech."},{"ref":"Jeremiah 32:35","text":"They built the high places of Baal… to offer up their sons and daughters to Molech, which I did not command."},{"ref":"Genesis 22:13","text":"Behold, behind him was a ram… Abraham offered it up as a burnt offering instead of his son."}]},"gifting":{"primary":["(Altar — counterfeit of consecration)"],"operational":["Counterfeit of vocation; demands what should be stewarded"]},"shadow":{"idol":"Future / Vision (made into a god)","altarName":"Molech","lieQuote":"If I do not feed the vision with what is most beloved, the future will not arrive. The cause is greater than the children.","diagnostics":["Have your children, your marriage, or your friendships been laid on the altar of your calling?","Do you justify chronic neglect with eschatological urgency?","Have you taught your team that the mission requires what you would never demand outside ministry?","Is there a body of 'collateral damage' behind your vision that you have stopped grieving?"],"lubricant":"The thrilling sense of being part of something historic. The compliments on your sacrifice. The shared mythology of the cost.","legalAccess":"Visions held tighter than the children. Molech gains jurisdiction wherever 'the future of the kingdom' is invoked to justify present consumption of the beloved.","fruitInLife":["Adult children who don't speak to you","Marriages preserved on paper, hollowed in fact","Movements built on burned-out staff","A trail of 'understandable' casualties"]},"countermove":{"name":"The Ram in the Thicket","remedyHeadline":"Take the beloved off the altar — the Lamb has already been provided.","description":"Molech is torn down when the Lord's substitute (the Ram, ultimately the Lamb) is received — when the beloved is taken off the altar because Christ has already paid what the future requires.","repentancePattern":["Name the children, marriage, friendships you placed on the altar","Renounce Molech and the visions that demand them","Lift them off, by name, declaring the Lamb's substitute","Restore one specific relationship at the cost of the vision's pace"],"ancientCase":"Genesis 22 — Abraham's hand stayed, the ram provided. Yahweh is not Molech. The God who tested Abraham was the God who provided the substitute.","modernTranslation":"The ministry leader whose children are casualties of the calling. The activist whose cause has eaten the marriage. The founder whose team is the offering.","decree":"The Lamb has been provided. I take my children off the altar. The vision will not be fed with the beloved.","counterAltar":{"name":"Altar of the Lamb","description":"Where Molech demands the beloved, the Altar of the Lamb has already received the substitute. Build a daily altar that lays the beloved (children, marriage, friendships) before Christ rather than before the vision."}},"frequencies":{"core":{"name":"Consecrated Vision","signature":"Visions stewarded under the Lamb; the beloved kept whole."},"inverse":{"name":"Consuming Vision","signature":"Urgency that justifies neglect; cause that eats the children."}},"related":{"callings":["apostle","evangelist","king"],"altars":["baal","high-places"],"frequencies":["striving-rest","scarcity-provision"]}},{"id":"al-babel","slug":"babel","category":"altar","title":"Babel","domain":"Altar Archetype","tagline":"The altar of the made name — building toward heaven on borrowed bricks.","trueCalling":{"essence":"Babel is the altar of the self-made name — the project of reaching heaven by human ingenuity, scale, and unified speech. Wherever a kingdom is built primarily to make a name, Babel has authority.","mandate":"(Recognizing Babel is the mandate.) The kingdom comes by descent, not ascent — God came down (Gen 11:5; Phil 2:6-8). The name we are given is His, not the one we build.","scripture":[{"ref":"Genesis 11:4","text":"Let us build ourselves a city and a tower… and let us make a name for ourselves."},{"ref":"Philippians 2:6-9","text":"He emptied himself… therefore God has highly exalted him and bestowed on him the name."},{"ref":"Revelation 18:2","text":"Fallen, fallen is Babylon the great."}]},"gifting":{"primary":["(Counterfeit of apostolic building)"],"operational":["Mimics scale, unity, and ascent — without descent"]},"shadow":{"idol":"Reputation / Name","altarName":"Babel","lieQuote":"If I do not make a name, I will not be remembered. The scale is the mission. The unified language is the proof of the Spirit.","diagnostics":["Are you building toward heaven, or has heaven come down to where you are?","Has 'unity' become enforced same-speak?","Do you measure the kingdom by your platform's growth?","Have you confused influence with authority?"],"lubricant":"The intoxication of momentum. The compliments on the 'movement.' The relief of being unanimously praised by a tribe whose vocabulary you control.","legalAccess":"Ambition seeking ascent without descent. Babel gains jurisdiction wherever the name being made is the founder's, not the Lamb's.","fruitInLife":["Towers that confuse the speech of those who built them","Movements that scatter when the founder falls","An inability to speak any language but your own","Glory hoarded, then lost"]},"countermove":{"name":"Pentecost Reversed-Babel","remedyHeadline":"Empty yourself first — the Name to be exalted is His, not yours.","description":"Babel is torn down when descent precedes ascent — when the Spirit, descending, gives speech in many tongues for the praise of one Name (Acts 2). Pentecost is Babel reversed: God's name spoken in every language, not man's name in one.","repentancePattern":["Confess the name you have been building","Renounce Babel — repent of ascent without descent","Empty yourself of one piece of platform","Speak in a language not your tribe's; honor a voice not your franchise"],"ancientCase":"Acts 2 — the Spirit descends, the disciples speak the wonders of God in every tongue. The undoing of Babel is the praise of His Name in languages He gave.","modernTranslation":"The mega-ministry whose brand is more recognizable than its Christ. The network whose unified vocabulary is enforced by exclusion. The leader whose 'movement' cannot survive his absence.","decree":"He came down. I will not ascend on borrowed bricks. The Name is His. I will speak many tongues for one praise.","counterAltar":{"name":"Altar of Pentecost (Descended Spirit)","description":"Where Babel ascends to make a name, the Altar of Pentecost waits in an upper room until the Spirit descends. Build a daily altar of waiting in hiddenness rather than building from ambition."}},"frequencies":{"core":{"name":"Descended Authority","signature":"Authority from kenosis (self-emptying); influence rooted in obedience."},"inverse":{"name":"Made-Name Ambition","signature":"Ascent-energy; brand-protectionism; enforced unity."}},"related":{"callings":["apostle","evangelist","teacher"],"altars":["mammon","high-places"],"frequencies":["visibility-hidden","performance-belovedness"]}},{"id":"al-mammon","slug":"mammon","category":"altar","title":"Mammon","domain":"Altar Archetype","tagline":"The altar that promises security in exchange for trust.","trueCalling":{"essence":"Mammon is not money; Mammon is the spirit that traffics in money for trust. Mammon offers what only the Father can give — provision, security, identity, status — in exchange for the heart's allegiance. Jesus named it the only rival named directly: 'You cannot serve God and Mammon' (Matt 6:24).","mandate":"(Recognizing Mammon is the mandate.) The Father is the source — Yahweh-Yireh, the God who sees and provides (Gen 22:14). Mammon is dethroned by daily trust, sabbath, and reckless generosity.","scripture":[{"ref":"Matthew 6:24","text":"You cannot serve God and Mammon."},{"ref":"1 Timothy 6:10","text":"The love of money is a root of all kinds of evils."},{"ref":"2 Corinthians 8:9","text":"Though he was rich, yet for your sake he became poor."}]},"gifting":{"primary":["(Counterfeit of providence)"],"operational":["Mimics provision, security, and inheritance"]},"shadow":{"idol":"Money / Security / Self-Provision","altarName":"Mammon","lieQuote":"If I have enough, I am safe. The Lord helps those who help themselves. My anxiety is just stewardship.","diagnostics":["Do you check your accounts more than you wait on the Lord?","Has generosity become leverage?","Do you postpone obedience for financial reasons that are functionally automatic?","Has scarcity-thinking persisted into seasons of clear provision?"],"lubricant":"The numbing comfort of a healthy balance. The respect of being known as a careful steward. The illusion of control that financial buffer provides.","legalAccess":"Anxiety about provision, treated as wisdom. Mammon gains jurisdiction wherever security is sourced from accumulation rather than from the Father.","fruitInLife":["Anxiety in plenty, panic in scarcity","Hoarding disguised as stewardship","Generosity that secretly seeks return","An inability to obey when obedience is expensive"]},"countermove":{"name":"Yahweh-Yireh","remedyHeadline":"Sabbath, tithe, and give beyond plan — sourcing security from the Father, not the balance.","description":"Mammon is dethroned by trust enacted — by sabbath, by the tithe, by giving recklessly when the Spirit prompts, by refusing to hedge against God with the bank account.","repentancePattern":["Confess the provision sourced from striving and the security sourced from balance","Renounce Mammon by name","Sabbath weekly; tithe consistently; give beyond plan when prompted","Receive a gift you cannot repay"],"ancientCase":"Genesis 22 — 'On the mount of the Lord it shall be provided.' Abraham did not get a financial plan; he got a God who provides exactly what is needed at the moment of obedience.","modernTranslation":"The Christian whose worship is fervent and whose budget makes obedience impossible. The minister whose generosity is calculated for visibility. The wealthy disciple whose spiritual life is downstream of his portfolio.","decree":"The Lord is my provider. I dethrone Mammon. I sabbath, I tithe, I give beyond plan. My security is His face.","counterAltar":{"name":"Altar of First Fruits","description":"Where Mammon demands accumulation, the Altar of First Fruits gives the first and the best before the rest is calculated. Build a daily altar of the tithe-before-budget that names the Father as source."}},"frequencies":{"core":{"name":"Provision from the Father","signature":"Open hands, unhurried generosity, sabbath unforced."},"inverse":{"name":"Mammon Anxiety","signature":"Tight chest at scarcity; balance as oxygen; obedience priced."},"neurochemistry":"Inverse runs on chronic sympathetic activation around money — a low-grade survival state that interprets scarcity as death."},"related":{"callings":["asher","king","marketplace","zebulun"],"altars":["babel","high-places"],"frequencies":["scarcity-provision","striving-rest"]}},{"id":"al-ashtoreth","slug":"ashtoreth","category":"altar","title":"Ashtoreth","domain":"Altar Archetype","tagline":"The altar of seductive belonging — affection traded for soul.","trueCalling":{"essence":"Ashtoreth (Astarte, the queen of heaven) is the altar of seductive belonging — fertility, romance, beauty, comfort offered as substitutes for covenant intimacy. Wherever affection, attractiveness, or romantic union is sourced from anywhere but the bridegroom, Ashtoreth has authority.","mandate":"(Recognizing Ashtoreth is the mandate.) The bridegroom is Christ. Beauty, romance, fertility, and belonging are restored when the bride looks first at His face (Song 4).","scripture":[{"ref":"Judges 2:13","text":"They abandoned the Lord and served the Baals and the Ashtaroth."},{"ref":"1 Kings 11:5","text":"Solomon went after Ashtoreth, the goddess of the Sidonians."},{"ref":"Ephesians 5:25-27","text":"Christ loved the church and gave himself up for her."}]},"gifting":{"primary":["(Counterfeit of bride-affection)"],"operational":["Mimics intimacy, belonging, beauty"]},"shadow":{"idol":"Affection / Beauty / Sexual identity","altarName":"Ashtoreth","lieQuote":"If I am beautiful enough, wanted enough, partnered enough — I will be safe. My longing is my deepest truth.","diagnostics":["Do you source belonging from being chosen by people rather than by Christ?","Has aesthetic, romantic, or sexual longing become an unquestioned authority in your life?","Do you cultivate attractiveness as protection?","Has 'the body' become an altar of self-worship or an altar of self-loathing?"],"lubricant":"The warm hum of being desired. The intoxication of romantic intensity. The relief of feeling beautiful, even briefly. The drama of unrequited longing.","legalAccess":"Sourcing identity, beauty, or belonging from anywhere but the Bridegroom. Ashtoreth gains jurisdiction wherever the bride looks for adornment from the world's mirrors.","fruitInLife":["Romantic chaos; serial seasons of consuming intensity","Identity tied to being chosen","Bodies treated as altars (worshiped or punished)","Spiritual coldness behind sensual heat"]},"countermove":{"name":"Bride at the Bridegroom's Face","remedyHeadline":"Look at the Bridegroom — let belonging come from His face, not from any other mirror.","description":"Ashtoreth is torn down when the bride looks at the Bridegroom's face — when affection, beauty, and belonging are sourced from Christ, and when union is honored as covenant rather than consumed as currency.","repentancePattern":["Confess the names of those from whom you have sourced belonging","Renounce Ashtoreth and the queen-of-heaven affection","Fast from the mirrors that source identity","Receive Christ's gaze; return to covenant"],"ancientCase":"Song of Songs 4 — 'You are altogether beautiful, my love; there is no flaw in you.' The bride is restored not by adornment but by the Bridegroom's word over her.","modernTranslation":"The Christian whose worship is sincere and whose phone history is a different liturgy. The leader whose marriage is performative and whose private affections are diffuse. The single believer whose longing has become an idol the church is afraid to name.","decree":"I am the bride of Christ. My belonging is in His face. I dethrone Ashtoreth. My beauty is His word over me.","counterAltar":{"name":"Altar of the Bridegroom (Bride-Chamber)","description":"Where Ashtoreth seduces with the world's mirrors, the Altar of the Bridegroom is the secret place where the bride is named beloved. Build a daily altar of beholding His face before the day's mirrors."}},"frequencies":{"core":{"name":"Bride-Affection","signature":"Belonging sourced from Christ; covenant intimacy honored."},"inverse":{"name":"Ashtoreth Hunger","signature":"Romantic / sensual intensity that crowds the secret place."},"neurochemistry":"Inverse runs on dopaminergic reward loops around novelty, fantasy, and being-chosen — the body trains itself to need intensity to feel alive."},"related":{"callings":["pastor","naphtali","craftsman"],"altars":["high-places","baal"],"frequencies":["rejection-sonship","performance-belovedness"]}},{"id":"al-high-places","slug":"high-places","category":"altar","title":"High Places","domain":"Altar Archetype","tagline":"The altars left standing because they helped on the way up.","trueCalling":{"essence":"High places are the local altars — often built to Yahweh originally but never torn down — that compete with the central place of worship. Even good kings 'did not remove the high places' (1 Kgs 15:14). They are the unconfessed compromises that quietly co-author a life.","mandate":"(Recognizing high places is the mandate.) Tear them down. Centralize worship. Refuse the convenient altar even when it is dressed in the right Name.","scripture":[{"ref":"1 Kings 15:14","text":"But the high places were not taken away."},{"ref":"2 Kings 18:4","text":"Hezekiah removed the high places and broke the pillars… and broke in pieces the bronze serpent."},{"ref":"Hosea 10:8","text":"The high places of Aven, the sin of Israel, shall be destroyed."}]},"gifting":{"primary":["(Counterfeit of worship-everywhere)"],"operational":["Mimics convenient access to God"]},"shadow":{"idol":"Comfortable Compromise — the altar that helped on the way up","altarName":"High Places","lieQuote":"It worked once. It is not really hurting anything. It is to the same God anyway. Let me keep this one altar.","diagnostics":["Is there an old altar (a habit, an alliance, a former partnership) you have never explicitly torn down?","Do you tolerate practices in your life because they were once useful?","Have you let bronze serpents (former breakthroughs) become objects of present worship?","Have you justified compromise because the central altar of your life looks healthy?"],"lubricant":"The warm familiarity of the old altar. Sentimentality. The story of how 'the Lord met me here once.'","legalAccess":"Centralized worship undermined by tolerated peripheral altars. The altar gains jurisdiction wherever an unconfessed compromise is allowed to remain because it once produced fruit.","fruitInLife":["A faith that looks central and is functionally polytheistic","Recurrent struggle in one specific area for no obvious reason","Generational patterns that persist despite revival","A theology that has explained why the altar can stay"]},"countermove":{"name":"Hezekiah's Hammer","remedyHeadline":"Tear it down by name — even the once-holy bronze serpent must go when it has become an idol.","description":"High places are torn down by specific, named, public renunciation — by Hezekiah-style breaking even of the once-holy bronze serpent, by Josiah-style reform that does not tolerate the convenient altar.","repentancePattern":["Name each high place specifically (the practice, person, alliance, mythology)","Renounce it in the name of Christ","Break the artifact (delete, remove, return, end)","Centralize worship — establish a single, daily altar to the Lord alone"],"ancientCase":"2 Kings 18 — Hezekiah broke the bronze serpent that had once saved Israel because the people had begun to worship it. Even God-given symbols can become high places when they outlive the moment they served.","modernTranslation":"The believer whose life is mostly devoted and quietly polytheistic. The leader whose breakthrough season has become an artifact still being burned incense to. The intercessor with one private compromise that has outlived its rationale.","decree":"I tear down the high places. The Lord alone is my altar. I will not let the convenient remain because it once helped.","counterAltar":{"name":"Centralised Altar (One Altar, One Lord)","description":"Where high places multiply convenient access, the Centralised Altar refuses every peripheral and offers worship in one specific, daily place. Build a single altar of the day with no rival shrines."}},"frequencies":{"core":{"name":"Centralized Worship","signature":"One altar, one Lord, no tolerated peripherals."},"inverse":{"name":"Tolerated Compromise","signature":"Functional polytheism with orthodox vocabulary."}},"related":{"callings":["king","priest","pastor"],"altars":["baal","ashtoreth","molech"],"frequencies":["control-surrender"]}},{"id":"al-baal","slug":"baal","category":"altar","title":"Baal","domain":"Altar Archetype","tagline":"The altar that traffics in storm and harvest — power-for-payment.","trueCalling":{"essence":"Baal is the storm-god altar of transactional spirituality — power exchanged for ritual, harvest exchanged for syncretism, breakthrough exchanged for compromise. Wherever spiritual outcomes are bought rather than received, Baal has authority.","mandate":"(Recognizing Baal is the mandate.) The Lord answers by fire (1 Kgs 18). He does not negotiate. He does not split harvest with rivals.","scripture":[{"ref":"1 Kings 18:21","text":"How long will you go limping between two opinions? If the Lord is God, follow him; but if Baal, then follow him."},{"ref":"Hosea 2:8","text":"She did not know that it was I who gave her the grain, the wine, and the oil."},{"ref":"Romans 11:4","text":"I have kept for myself seven thousand men who have not bowed the knee to Baal."}]},"gifting":{"primary":["(Counterfeit of breakthrough)"],"operational":["Mimics storm, harvest, power"]},"shadow":{"idol":"Power / Outcome (transactional)","altarName":"Baal","lieQuote":"If I do the right ritual, the harvest comes. The Lord is one source among many. A little hedging only makes me wise.","diagnostics":["Do you treat spiritual disciplines as ritual exchange for outcome?","Have you held quiet alliances with practices the Lord does not bless because 'they work'?","Do you limp between opinions, calling it nuance?","Have storms in your soul become the only language in which you experience power?"],"lubricant":"The reliable feeling of breakthrough after the ritual. The intoxication of storm. The sense of being plugged into something powerful.","legalAccess":"Syncretism — mixing the Lord's worship with other sources of power. Baal gains jurisdiction wherever 'whatever works' overrides 'whatever He says.'","fruitInLife":["Spiritual results without spiritual fruit","Power that does not change the heart","Repeated cycles of storm and drought","Allegiances the Lord has never blessed"]},"countermove":{"name":"Carmel Fire","remedyHeadline":"Build one altar, soak it, and wait — let the Lord answer by fire.","description":"Baal is dethroned by the Carmel choice — building one altar, soaking it with water (eliminating self-effort), and asking the Lord alone to answer by fire.","repentancePattern":["Name the rituals and alliances treated as power-exchange","Renounce Baal — refuse syncretism explicitly","Soak the altar (cease self-effort)","Wait, audibly, for the Lord to answer by fire"],"ancientCase":"1 Kings 18 — Elijah on Carmel. The Lord, not Baal, answers by fire. The seven thousand who did not bow are kept.","modernTranslation":"The believer who pairs intercession with horoscopes. The leader whose 'prayer techniques' function like ritual magic. The minister whose breakthroughs are dependent on practices the Spirit has not endorsed.","decree":"The Lord alone is God. I will not limp between opinions. I refuse Baal and wait for fire.","counterAltar":{"name":"Altar of Carmel Fire","description":"Where Baal trades ritual for outcome, the Altar of Carmel waits — soaked and undefended — for the Lord's fire alone. Build a daily altar of un-helped trust that asks for fire and refuses every rival source."}},"frequencies":{"core":{"name":"Fire-Answered Trust","signature":"Patient waiting on the Lord; one altar; no rivals."},"inverse":{"name":"Transactional Power","signature":"Ritual-for-outcome thinking; syncretism normalized."}},"related":{"callings":["prophet","watchman"],"altars":["high-places","ashtoreth","python"],"frequencies":["control-surrender"]}},{"id":"al-python","slug":"python","category":"altar","title":"Python (Spirit of Divination)","domain":"Altar Archetype","tagline":"The altar that constricts the breath and trades insight for worship.","trueCalling":{"essence":"Python is the spirit of divination (Acts 16:16) — the constricting serpent that crushes the breath while offering 'insight.' Python mimics prophecy with information, mimics wisdom with prediction, and trades worship for influence. It silences as much as it speaks.","mandate":"(Recognizing Python is the mandate.) Paul commanded it out: 'I command you in the name of Jesus Christ to come out of her.' Python is dethroned by Spirit-given prophecy and intercessory breath.","scripture":[{"ref":"Acts 16:16-18","text":"A slave girl who had a spirit of divination… Paul, greatly annoyed, said, 'I command you in the name of Jesus Christ to come out of her.'"},{"ref":"Deuteronomy 18:10-12","text":"There shall not be found among you anyone who… practices divination."},{"ref":"1 Samuel 28","text":"Saul and the medium of Endor — divination as the end of the king's road."}]},"gifting":{"primary":["(Counterfeit of prophecy)"],"operational":["Mimics insight, foresight, deep reading of others"]},"shadow":{"idol":"Insight without intimacy; control through information","altarName":"Python","lieQuote":"I see things others can't. The information is my anointing. I will use any source as long as it works.","diagnostics":["Do you struggle to breathe in places of true worship?","Has 'discernment' come to mean reading people without loving them?","Have you accepted information from sources the Spirit did not give?","Do you experience constriction (chest, throat) when ministering, especially in prayer?"],"lubricant":"The icy clarity of being right about people. The reverence accuracy buys. The pull of information as power.","legalAccess":"Curiosity entertained outside covenant — fortune-telling, occult, divinatory practices, even prophetic 'reading' divorced from intimacy. Python gains jurisdiction wherever insight is sought without surrender.","fruitInLife":["Constricted prayer life","Increasing intimidation of others by your accuracy","Spiritual breath-shortness in worship","A trail of 'read' people who were not loved"]},"countermove":{"name":"Pauline Command","remedyHeadline":"Command Python out in Jesus' name — restore breath through worship and prophesy from intimacy.","description":"Python is broken by the Pauline command in the Name of Jesus — and it is kept off by intercessory breath: speaking the Word aloud, sustained worship, prophesy from intimacy not observation.","repentancePattern":["Name the divinatory entry points (practices, sources, habits)","Renounce Python explicitly in Jesus' name","Restore breath: sing, pray aloud, bless people instead of reading them","Seek prophecy only from the council of the Lord (Jer 23:18)"],"ancientCase":"Acts 16 — Paul commands the spirit out, the slave girl is freed, and the city is shaken. Python is not negotiated with; it is commanded.","modernTranslation":"The 'prophetic voice' whose accuracy chills rather than warms. The intercessor whose discernment has become diagnosis of everyone around them. The believer whose spiritual gifts function under a low-grade constriction in the chest.","decree":"In the name of Jesus, I command Python to release. I prophesy from intimacy. I breathe in worship. My discernment serves love.","counterAltar":{"name":"Altar of Intercessory Breath","description":"Where Python constricts and reads, the Altar of Intercessory Breath sings, prays aloud, and prophesies from intimacy. Build a daily altar of audible worship that restores the breath Python tightens."}},"frequencies":{"core":{"name":"Spirit-Sourced Insight","signature":"Discernment that warms; words that smell of His face."},"inverse":{"name":"Constricting Accuracy","signature":"Cold reading of others; chest-tight ministry; insight without breath."}},"related":{"callings":["prophet","watchman","dan"],"altars":["babel","high-places","baal"],"frequencies":["control-surrender"]}},{"id":"al-golden-calf","slug":"golden-calf","category":"altar","title":"Golden Calf","domain":"Altar Archetype","tagline":"The altar built when the leader is on the mountain too long.","trueCalling":{"essence":"The golden calf is the visible god made by the people when the mediator delays — Yahweh's name spoken over a calf cast from the people's gold (Ex 32). The golden calf is the altar of impatience: making a god in the image of what we already trust, and calling it the Lord.","mandate":"(Recognizing the golden calf is the mandate.) The Lord is not the projection of the camp's anxiety. He is the One who descended in fire and will not be re-cast in human form.","scripture":[{"ref":"Exodus 32:1-6","text":"Up, make us gods who shall go before us… and they sat down to eat and drink and rose up to play."},{"ref":"Acts 7:41","text":"They made a calf in those days, and offered a sacrifice to the idol and were rejoicing in the works of their hands."},{"ref":"Romans 1:23","text":"They exchanged the glory of the immortal God for images."}]},"gifting":{"primary":["(Counterfeit of the visible presence)"],"operational":["Mimics worship of the True God by re-casting Him in our image"]},"shadow":{"idol":"A manageable God / A god that goes before us","altarName":"Golden Calf","lieQuote":"Moses is taking too long. We need a god we can see. We are still worshiping the Lord — we are just giving Him a form.","diagnostics":["Have you re-cast Christ into the image of your tribe's preferences?","When the Lord delays, do you build a manageable substitute and call it His name?","Has worship become 'the works of your hands' — productions, programs, content?","Do you prefer a god that goes before you to the God you must wait on?"],"lubricant":"The relief of having something to point to. The legitimacy of 'we are still worshiping Yahweh.' The party that follows the casting.","legalAccess":"Impatience with the mediator's delay (Ex 32:1). The altar gains jurisdiction wherever waiting is replaced by manufacture.","fruitInLife":["Worship that has the right Name and the wrong shape","Theological precision around a culturally-shaped Christ","Energy spent celebrating works of our hands","Plagues no one connects to the calf"]},"countermove":{"name":"Wait for the Mediator","remedyHeadline":"Refuse the manageable god — wait for the Mediator who descends, even if He delays.","description":"The golden calf is torn down by waiting — by ground gold mixed with water and drunk in repentance (Ex 32:20), and by the True Mediator's return.","repentancePattern":["Confess the calf you have cast (the manageable Christ)","Renounce impatience with the Lord's delay","Grind the calf — dismantle the productions, programs, brands that have become the form of worship","Wait for the Mediator. He is not late."],"ancientCase":"Exodus 32 — Moses descends, breaks the tablets, grinds the calf, makes Israel drink it. The golden calf is unmade by the return of the mediator and the bitter cup of repentance.","modernTranslation":"The church whose Christ matches its political affiliation perfectly. The ministry whose worship is the brand. The believer whose 'God' has the same opinions, accent, and aesthetic as the believer.","decree":"I will wait for the Mediator. I refuse the manageable god. I will not cast the Lord in my own image.","counterAltar":{"name":"Altar of the Tabernacle (Pattern from the Mountain)","description":"Where the calf is cast from impatience, the Altar of the Tabernacle is built only from the pattern shown on the mountain (Ex 25:9). Build a daily altar that refuses to manufacture God in your own image and waits on revealed form."}},"frequencies":{"core":{"name":"Patient Worship","signature":"Waiting on the Lord without manufacturing Him; worship of the One who descends."},"inverse":{"name":"Manufactured God","signature":"Worship of the works of our hands; orthodox names over heterodox forms."}},"related":{"callings":["levi","priest","apostle"],"altars":["babel","high-places"],"frequencies":["striving-rest","control-surrender"]}}],"idols":[{"id":"id-power","slug":"power","category":"idol","title":"Power","domain":"Deep Idol","tribe":"Power","tagline":"The heart that believes it is alive only when it is in control of outcomes.","trueCalling":{"essence":"Beneath the surface idol of money, status, or platform sits the deep idol of Power — the conviction that life is only safe when I am the one steering. Power says: if I am not in charge, I will not survive. The redeemed counterpart is governmental authority received in sonship — the kind of authority Jesus exercised because He had nothing left to grasp (Phil 2:6).","mandate":"(Recognizing the Power-idol is the mandate.) The Father gives authority to those who lay it down. The kingdom is received, not seized.","scripture":[{"ref":"Philippians 2:6-8","text":"Though he was in the form of God, did not count equality with God a thing to be grasped."},{"ref":"Mark 10:42-43","text":"Whoever would be great among you must be your servant."},{"ref":"Daniel 4:30-32","text":"Is not this great Babylon, which I have built… the kingdom is departed from thee."}]},"gifting":{"primary":["(Deep idol — counterfeit of governmental sonship)"],"operational":["Drives ambition, control, and the need to author outcomes"]},"shadow":{"idol":"Power — control as life-source","altarName":"Babel · Throne of the Counterfeit Lion","lieQuote":"If I am not in control, I will be crushed. My grip is the only thing holding this together. To release authority is to die.","diagnostics":["Do you feel an almost physical recoil when someone makes a decision without you?","Is your peace tied to whether you are winning?","Have you confused stewardship with sovereignty?","Do you exhaust yourself maintaining outcomes that were never yours to author?"],"lubricant":"The clean dopamine of being right, being first, being asked. The hush of a room when you decide. The intoxication of being indispensable.","legalAccess":"Early experiences where powerlessness meant harm. The vow — silent, often forgotten — never to be that small again. Power gains jurisdiction wherever 'I will not be vulnerable' has hardened into a way of life.","fruitInLife":["Burnout from carrying weights never assigned","Relationships that function only when you lead them","Anger disproportionate to the slight","An inability to receive correction without re-asserting control"]},"countermove":{"name":"Servant Authority","remedyHeadline":"Receive authority by laying it down — kneel before you legislate.","description":"The Power-idol is dethroned not by becoming weak but by becoming a servant — by exercising authority from the basin and the towel (John 13), by trusting the Father with outcomes the heart has been white-knuckling.","repentancePattern":["Name the rooms, projects, people whose outcomes you have been authoring","Renounce Power as the source of your safety","Wash one specific person's feet — serve where you would normally lead","Release one decision, by name, into the Father's hands without re-grasping"],"ancientCase":"Nebuchadnezzar in Daniel 4 — driven into the field until he lifted his eyes to heaven and 'blessed the Most High.' The kingdom was returned only after the king learned the Most High rules.","modernTranslation":"The founder who can't take a sabbatical because the company is the self. The pastor whose elders are advisors with no veto. The parent whose adult children call before they breathe.","decree":"I am not the source of my safety. I lay down what was never mine to grip. The Father rules; I serve under His hand."},"frequencies":{"core":{"name":"Servant Authority","signature":"Authority exercised from rest; decisions made in the open palm."},"inverse":{"name":"Grasping Control","signature":"Tight chest at perceived loss of control; compulsive decision-authoring."},"neurochemistry":"Inverse runs on chronic sympathetic activation — the body interprets relinquished control as threat and floods the system to reclaim it."},"related":{"callings":["apostle","king","judah"],"altars":["babel","high-places"],"frequencies":["control-surrender","striving-rest"]}},{"id":"id-approval","slug":"approval","category":"idol","title":"Approval","domain":"Deep Idol","tribe":"Approval","tagline":"The heart that believes it is alive only when it is being chosen.","trueCalling":{"essence":"Beneath the surface idols of beauty, ministry success, or relational intensity sits the deep idol of Approval — the conviction that life is given by being seen, wanted, and praised. Approval says: if I am not being chosen, I am not real. The redeemed counterpart is belovedness received from the Father's voice over the Son at the Jordan (Matt 3:17), before any work is done.","mandate":"(Recognizing the Approval-idol is the mandate.) Belovedness is given before achievement. The Father's gaze is the only mirror that holds.","scripture":[{"ref":"Matthew 3:17","text":"This is my beloved Son, with whom I am well pleased."},{"ref":"John 5:44","text":"How can you believe, when you receive glory from one another?"},{"ref":"Galatians 1:10","text":"If I were still trying to please man, I would not be a servant of Christ."}]},"gifting":{"primary":["(Deep idol — counterfeit of belovedness)"],"operational":["Drives performance, image-management, and relational chasing"]},"shadow":{"idol":"Approval — being-chosen as life-source","altarName":"Ashtoreth · Performance-Belovedness","lieQuote":"If they do not choose me, I do not exist. If I am not being praised, I am being forgotten. Their gaze is what makes me real.","diagnostics":["Do you replay conversations to verify how you were perceived?","Has your ministry, art, or work become unconsciously calibrated to what is praised?","Do you collapse when criticized by people you do not even respect?","Do you feel invisible in seasons of hiddenness?"],"lubricant":"The warm hum of being liked. The screenshot. The DM that says 'this changed me.' The platform metric that confirms you are seen.","legalAccess":"Childhood conditional love — affection given in exchange for performance. The vow never to risk being un-chosen again. Approval gains jurisdiction wherever the Father's voice is too quiet to compete with the room's.","fruitInLife":["An inner life calibrated to an audience","Identity that collapses without affirmation","Friendships maintained by performance","Truth softened until it stops costing approval"]},"countermove":{"name":"Beloved Before the Work","remedyHeadline":"Receive the Father's 'beloved' before you produce a thing — and let it precede every room.","description":"The Approval-idol is dethroned by hearing the Father's voice over the Son before any work is done — by entering rooms already chosen, so the room cannot give what the Father has already given.","repentancePattern":["Confess the audiences you have been performing for","Renounce Approval as the source of your aliveness","Sit, daily, until you can hear the Father's belovedness over you in silence","Take one action you know will not be applauded; refuse to explain it"],"ancientCase":"Jesus at the Jordan (Matt 3) and in the wilderness (Matt 4) — the Father's voice came before the ministry, and the wilderness tested whether He could keep His identity without anyone watching.","modernTranslation":"The pastor whose sermons are unconsciously written for the loudest amen. The artist who can no longer make work the algorithm won't reward. The leader whose identity bleeds out the moment the platform pauses.","decree":"I am beloved before the work. The Father has already chosen me. I dethrone Approval. My belovedness precedes every room."},"frequencies":{"core":{"name":"Belovedness","signature":"Quiet, weighted presence; identity that does not flinch when ignored."},"inverse":{"name":"Approval Hunger","signature":"Hyper-attunement to others' reactions; chronic post-mortem of conversations."},"neurochemistry":"Inverse runs on intermittent dopamine reward from social affirmation — the same loop that drives compulsive screen-checking. The body trains itself to need the next praise to feel alive."},"related":{"callings":["pastor","evangelist","naphtali"],"altars":["ashtoreth","babel"],"frequencies":["performance-belovedness","rejection-sonship"]}},{"id":"id-comfort","slug":"comfort","category":"idol","title":"Comfort","domain":"Deep Idol","tribe":"Comfort","tagline":"The heart that believes it is alive only when nothing is asked of it.","trueCalling":{"essence":"Beneath the surface idols of food, screens, ease, and avoidance sits the deep idol of Comfort — the conviction that life is found in the absence of demand. Comfort says: if I am not at rest, I am being harmed. The redeemed counterpart is true Sabbath — rest received from the Father, not extracted from the calling.","mandate":"(Recognizing the Comfort-idol is the mandate.) The yoke of Christ is easy, but it is a yoke. Sabbath is rest in the Father, not retreat from Him.","scripture":[{"ref":"Hebrews 4:9-11","text":"There remains a Sabbath rest for the people of God… let us strive to enter that rest."},{"ref":"Amos 6:1","text":"Woe to those who are at ease in Zion."},{"ref":"Luke 9:23","text":"If anyone would come after me, let him deny himself and take up his cross daily."}]},"gifting":{"primary":["(Deep idol — counterfeit of Sabbath)"],"operational":["Drives avoidance, numbing, and the slow refusal of assignment"]},"shadow":{"idol":"Comfort — ease as life-source","altarName":"High Places · Altar of the Lotus","lieQuote":"I have already given enough. If I rest now, the obedience can wait. The Lord understands that I am tired.","diagnostics":["Do your 'rests' leave you more numb than restored?","Have you begun to call avoidance 'wisdom'?","Do you reach for the screen, the food, the drink the moment a hard conversation looms?","Has your secret place been replaced by your couch?"],"lubricant":"The sigh of decompression. The well-earned glass. The numbing scroll. The legitimate vacation that has quietly become the center of the year.","legalAccess":"A childhood of overstimulation, demand, or volatility. The vow never to be that overwhelmed again. Comfort gains jurisdiction wherever the body has trained itself to interpret obedience as threat.","fruitInLife":["Half-completed assignments littering the soul","A growing inability to be uncomfortable for love's sake","Numbing habits that have outlived the season they relieved","Spiritual life that is sincere and small"]},"countermove":{"name":"Sabbath, Not Sedation","remedyHeadline":"Trade sedation for Sabbath — receive rest from the Father, then take up the cross.","description":"The Comfort-idol is dethroned by learning the difference between Sabbath and sedation — by receiving real rest from the Father's hand, then taking up the cross the next morning without flinching.","repentancePattern":["Name the numbing agents (food, screen, drink, scroll, fantasy)","Renounce Comfort as the source of your aliveness","Practice one true Sabbath — silence, no input, the Father's face","Obey one specific assignment you have been postponing"],"ancientCase":"Israel in Numbers 13 — at the edge of the land, comfort whispered that the giants were too big. A generation died in the wilderness because Sabbath had been replaced by sedation.","modernTranslation":"The believer whose sincere prayer life has not interrupted any habit in five years. The leader whose 'self-care' has eaten the calling. The disciple whose body has trained itself to require numbing every evening.","decree":"I trade sedation for Sabbath. I dethrone Comfort. I will be uncomfortable for love's sake, and I will rest in the Father's face."},"frequencies":{"core":{"name":"Sabbath Rest","signature":"Quiet body, open hands, unhurried obedience."},"inverse":{"name":"Sedated Avoidance","signature":"Numb fatigue dressed as tiredness; obedience postponed by the hour."},"neurochemistry":"Inverse runs on opioid-like reward from numbing inputs — the body trains itself to require disengagement to feel safe. Over time the threshold rises."},"related":{"callings":["pastor","asher"],"altars":["high-places","ashtoreth"],"frequencies":["striving-rest","control-surrender"]}},{"id":"id-control","slug":"control","category":"idol","title":"Control","domain":"Deep Idol","tribe":"Control","tagline":"The heart that believes it is alive only when the future is predictable.","trueCalling":{"essence":"Beneath the surface idols of planning, anxiety, and information sits the deep idol of Control — the conviction that life is only safe when the future has been managed. Control says: if I cannot predict it, I cannot survive it. The redeemed counterpart is the surrendered trust of the disciple who steps onto the water without seeing the bottom (Matt 14).","mandate":"(Recognizing the Control-idol is the mandate.) The Father holds tomorrow. Surrender is not passivity; it is the most active trust.","scripture":[{"ref":"Proverbs 3:5-6","text":"Trust in the Lord with all your heart, and do not lean on your own understanding."},{"ref":"Matthew 6:34","text":"Do not be anxious about tomorrow; tomorrow will be anxious for itself."},{"ref":"James 4:13-15","text":"You ought to say, 'If the Lord wills, we will live and do this or that.'"}]},"gifting":{"primary":["(Deep idol — counterfeit of providence-trust)"],"operational":["Drives anxiety, over-planning, and information-hoarding"]},"shadow":{"idol":"Control — predictability as life-source","altarName":"Python · High Places of the Plan","lieQuote":"If I think it through one more time, I can prevent the worst. My anxiety is just diligence. The future is mine to secure.","diagnostics":["Do you experience surrender as falling rather than landing?","Has 'discernment' become rehearsal of every possible failure?","Do you collect information you will never use, in case?","Are your prayers strategy briefings rather than communion?"],"lubricant":"The cool relief of a finished plan. The pleasure of being the one who saw it coming. The illusion of safety that comes from rehearsing every disaster in advance.","legalAccess":"Early experiences of unpredictable harm — usually relational. The vow never to be caught off-guard again. Control gains jurisdiction wherever the body has decided trust is too dangerous.","fruitInLife":["Anxiety dressed as wisdom","Plans that calcify into idols","An inability to receive surprise — including the Spirit's","Decision paralysis at every fork"]},"countermove":{"name":"Surrendered Trust","remedyHeadline":"Step onto the water — trade rehearsal for trust, plan for providence.","description":"The Control-idol is dethroned by surrendered trust enacted — by stepping onto the water before the bottom is visible, by handing the next 24 hours to the Father without a hedge.","repentancePattern":["Confess the futures you have been authoring in your head","Renounce Control as the source of your safety","Hand one specific situation, by name, to the Father — and refuse to take it back","Practice one obedience without rehearsing the outcome"],"ancientCase":"Peter on the water (Matt 14) — the moment he calculated the wind, he sank. Surrendered trust is a body posture, not a feeling.","modernTranslation":"The intercessor whose 'discernment' is anxious rehearsal of disaster. The planner whose calendar has eaten the Spirit's calendar. The believer whose obedience always has a contingency clause.","decree":"The Father holds tomorrow. I dethrone Control. I step onto the water. My trust is the obedience."},"frequencies":{"core":{"name":"Surrendered Trust","signature":"Open palms; decisions made without rehearsal; rest before the outcome."},"inverse":{"name":"Anxious Mastery","signature":"Mental rehearsal loops; over-planning; discernment as anxiety in vestments."},"neurochemistry":"Inverse runs on chronic prefrontal over-engagement and amygdala vigilance — the body interprets unpredictability as predator and refuses to stand down."},"related":{"callings":["watchman","dan","issachar"],"altars":["python","high-places","babel"],"frequencies":["control-surrender","striving-rest"]}}],"traumas":[{"id":"tr-orphan","slug":"orphan","category":"trauma","title":"The Orphan","domain":"Trauma Archetype","tribe":"Abandonment","tagline":"The wound of abandonment that vows to provide its own father.","trueCalling":{"essence":"The orphan is the soul shaped by abandonment — by absence, by the parent who could not or would not. The orphan-vow is: 'I will never need anyone again. I will be my own father.' Sanctified, the orphan becomes the son or daughter who finally lets the Father be Father — and who then carries fathering into rooms that have never felt it (Mal 4:6).","mandate":"To be adopted in the heart, not only in the doctrine — to receive the Father's daily provision, presence, and naming, and to break the orphan cycle in one's lineage.","scripture":[{"ref":"John 14:18","text":"I will not leave you as orphans; I will come to you."},{"ref":"Romans 8:15","text":"You did not receive the spirit of slavery to fall back into fear, but you have received the Spirit of adoption as sons."},{"ref":"Psalm 27:10","text":"For my father and my mother have forsaken me, but the Lord will take me in."}]},"gifting":{"primary":["Self-reliance refined into stewardship","Capacity to father what was not fathered to oneself"],"operational":["Pioneering","Resilient endurance","Hospitality to other orphans"]},"shadow":{"idol":"Self-provision — the vow never to need","altarName":"Mammon · Striving","lieQuote":"If I do not provide it, no one will. Asking is weakness. I will not be that small again.","diagnostics":["Do you struggle to receive — gifts, help, even compliments — without immediately reciprocating?","Has self-sufficiency become a moral identity?","Do you secretly believe the Father is for everyone but you?","Do you parent yourself harshly because no one else did?"],"lubricant":"The pride of being the one who never needed anyone. The cold competence of self-rescue. The grim satisfaction of proving you can.","legalAccess":"Early absence — physical, emotional, or spiritual — of a father (or mother) and the silent vow that followed. The orphan altar gains jurisdiction wherever 'I will not need' has hardened into a way of life.","fruitInLife":["Achievement without joy","Striving that no rest can interrupt","An inability to receive love without flinching","Mammon's quiet dominion in the budget"]},"countermove":{"name":"Adoption Received in the Body","remedyHeadline":"Let the Father be Father — receive adoption in the body, not just in the doctrine.","description":"The orphan is restored when adoption is received in the body, not only in the head — when the daily provision, presence, and naming of the Father are practiced until the vow dissolves.","repentancePattern":["Name the absence and the vow it produced","Renounce self-provision as identity","Receive — daily — provision you did not earn","Father (or mother) one specific person who is currently un-fathered"],"ancientCase":"Mephibosheth (2 Sam 9) — the orphaned son brought to David's table. Adoption is not a status; it is a daily seat.","modernTranslation":"The high-capacity leader who cannot rest. The believer whose theology of adoption never reached the chest. The minister who fathers thousands and is themselves un-fathered.","decree":"I am not an orphan. The Father has come. I receive adoption in the body. I will be fathered, and I will father what was not fathered to me."},"frequencies":{"core":{"name":"Sonship","signature":"Restful capacity; receiving without flinching; fathering that releases."},"inverse":{"name":"Orphan Striving","signature":"Restless self-provision; the body that cannot stop earning."},"neurochemistry":"Inverse runs on chronic cortisol from unmet attachment — the nervous system interprets dependency as danger and floods the body whenever surrender is required."},"related":{"callings":["apostle","asher","joseph"],"altars":["mammon","high-places"],"frequencies":["scarcity-provision","rejection-sonship","striving-rest"]}},{"id":"tr-stranger","slug":"stranger","category":"trauma","title":"The Stranger","domain":"Trauma Archetype","tribe":"Rejection","tagline":"The wound of rejection that vows to earn a seat by performance.","trueCalling":{"essence":"The stranger is the soul shaped by rejection — by exclusion, by being the one outside the circle. The stranger-vow is: 'I will earn my way in. I will perform until I belong.' Sanctified, the stranger becomes the one who gathers other outsiders, who knows that belonging is given before it is earned, and who carries the radical hospitality of God to the rejected.","mandate":"To receive belonging as gift before performance, and to become the host who recognizes strangers because they have been one — drawing the rejected into the family of God.","scripture":[{"ref":"Ephesians 2:19","text":"You are no longer strangers and aliens, but you are fellow citizens with the saints and members of the household of God."},{"ref":"Hebrews 13:2","text":"Do not neglect to show hospitality to strangers, for thereby some have entertained angels unawares."},{"ref":"Luke 15:22-24","text":"Bring quickly the best robe, and put it on him… for this my son was dead, and is alive again."}]},"gifting":{"primary":["Empathic hospitality","Discernment of the excluded","Gathering capacity"],"operational":["Bridge-building across tribes","Welcoming the marginal","Translating between worlds"]},"shadow":{"idol":"Belonging earned by performance","altarName":"Jezebel · Performance-Belovedness","lieQuote":"If I am useful enough, attractive enough, gifted enough — they will let me stay. The day I stop performing is the day they remember I do not belong.","diagnostics":["Do you experience belonging as conditional on your contribution?","Has your spiritual gift become the price of admission?","Do you perform vulnerability rather than risk it?","Do you collapse when you are not needed?"],"lubricant":"The relief of being needed. The hum of being the one who 'gets' the room. The seductive intensity of performing a role no one assigned.","legalAccess":"Early exclusions — the family that did not have room, the tribe that did not have language, the church that did not have a category. The stranger altar gains jurisdiction wherever 'I will earn the seat' became the way to survive.","fruitInLife":["Identity that disappears when the gift is not in use","Friendships maintained by usefulness","Chronic performance fatigue","Inner accusation in seasons of hiddenness"]},"countermove":{"name":"Welcomed Before Asked","remedyHeadline":"Receive the robe before you serve at the table — belonging precedes contribution.","description":"The stranger is restored when the prodigal's robe is received — when belonging is taken as gift before any performance, and when the body is taught that the seat is already held.","repentancePattern":["Name the rooms you have been buying your way into","Renounce performance as the price of belonging","Receive the robe — let yourself be welcomed without producing","Welcome one specific outsider into a room you used to perform to enter"],"ancientCase":"The prodigal (Luke 15) — running home with a rehearsed speech and being interrupted by a robe. The Father's welcome ended the performance before it could begin.","modernTran
